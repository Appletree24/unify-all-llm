<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unify 记忆</title>
<style>
/* Unify Memory — Warm Archival Folio & Stratified Architecture Design.
   Artisan paper palette (linen, cotton, espresso ink, terracotta & natural mineral pigments)
   paired with tactile folio tabs and an interactive strata elevation diagram. */
:root {
  /* Warm archival light surfaces (zero cold blue-grays) */
  --canvas: #f5f2eb;
  --rail: #ede9df;
  --paper: #fcfbf8;
  --paper-soft: #f7f4ed;
  --well: #eee9de;
  --line: #e2dcd0;
  --line-warm: #d4ccbd;

  /* Espresso ink hierarchy */
  --ink: #1f1c18;
  --ink-2: #4a443c;
  --dim: #766e63;
  --faint: #a1988a;

  /* Interactive washes */
  --hover: rgba(36, 30, 22, .048);
  --active: rgba(36, 30, 22, .082);

  /* Signature terracotta accent & semantic tones */
  --accent: #bf5a36;
  --accent-deep: #a44928;
  --accent-soft: rgba(191, 90, 54, .10);
  --ok: #3e6b4c;
  --ok-soft: rgba(62, 107, 76, .11);
  --warn: #a6691e;
  --warn-soft: rgba(166, 105, 30, .11);
  --err: #b53d32;
  --err-soft: rgba(181, 61, 50, .10);

  /* Curated natural mineral pigments for the 7 memory strata */
  --p-managed: #4d5f78;
  --p-user: #bf5a36;
  --p-project: #476f54;
  --p-local: #b07828;
  --p-nested: #3b7275;
  --p-auto: #7a5678;
  --p-agent: #a55661;

  /* Tactile paper shadows (warm ambient ring + soft lift) */
  --ring-sm: 0 0 0 1px rgba(36, 30, 22, .07), 0 1px 2px rgba(36, 30, 22, .04);
  --ring-sheet: 0 0 0 1px rgba(36, 30, 22, .08), 0 4px 16px -4px rgba(36, 30, 22, .07), 0 1px 3px rgba(36, 30, 22, .04);
  --ring-lift: 0 0 0 1px rgba(36, 30, 22, .11), 0 10px 26px -8px rgba(36, 30, 22, .12), 0 2px 6px rgba(36, 30, 22, .05);
  --shadow-modal: 0 0 0 1px rgba(36, 30, 22, .10), 0 24px 60px -12px rgba(26, 22, 16, .24);
  --specular: inset 0 1px 0 rgba(255, 255, 255, .75);

  --sans: "Segoe UI Variable Text", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --serif-num: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
  --mono: "Cascadia Code", "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #161513;
    --rail: #11100f;
    --paper: #1e1c19;
    --paper-soft: #1a1816;
    --well: #151412;
    --line: #2a2723;
    --line-warm: #38342e;

    --ink: #efeae2;
    --ink-2: #c4bdb2;
    --dim: #8f887d;
    --faint: #615b52;

    --hover: rgba(255, 248, 236, .052);
    --active: rgba(255, 248, 236, .092);

    --accent: #df825d;
    --accent-deep: #eb9674;
    --accent-soft: rgba(223, 130, 93, .14);
    --ok: #78a886;
    --ok-soft: rgba(120, 168, 134, .14);
    --warn: #dba358;
    --warn-soft: rgba(219, 163, 88, .14);
    --err: #e57b70;
    --err-soft: rgba(229, 123, 112, .14);

    --p-managed: #8ea5c2;
    --p-user: #df825d;
    --p-project: #7ca889;
    --p-local: #d6a054;
    --p-nested: #6ca6a9;
    --p-auto: #b38eb1;
    --p-agent: #d28792;

    --ring-sm: 0 0 0 1px rgba(255, 248, 236, .07), 0 1px 3px rgba(0, 0, 0, .3);
    --ring-sheet: 0 0 0 1px rgba(255, 248, 236, .075), 0 6px 20px -4px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 248, 236, .04);
    --ring-lift: 0 0 0 1px rgba(255, 248, 236, .12), 0 14px 32px -8px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 248, 236, .06);
    --shadow-modal: 0 0 0 1px rgba(255, 248, 236, .10), 0 28px 68px rgba(0, 0, 0, .65);
    --specular: inset 0 1px 0 rgba(255, 248, 236, .045);
    color-scheme: dark;
  }
}

[data-scope="managed"] { --pigment: var(--p-managed); }
[data-scope="user"]    { --pigment: var(--p-user); }
[data-scope="project"] { --pigment: var(--p-project); }
[data-scope="local"]   { --pigment: var(--p-local); }
[data-scope="nested"]  { --pigment: var(--p-nested); }
[data-scope="auto"]    { --pigment: var(--p-auto); }
[data-scope="agent"]   { --pigment: var(--p-agent); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--canvas);
  color: var(--ink);
  font: 14px/1.62 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
h1, h2, h3, h4, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 5px;
}
::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--line-warm); border-radius: 9px; border: 2.5px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--faint); border: 2.5px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

.icon { flex: none; display: block; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.faint { color: var(--faint); }

/* ── Controls ────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 31px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--line-warm); background: var(--paper); color: var(--ink);
  font-size: 13px; font-weight: 500; white-space: nowrap;
  box-shadow: var(--specular), 0 1px 2px rgba(36, 30, 22, .04);
  transition: background .14s, border-color .14s, transform .12s, opacity .14s;
}
.btn:hover:not(:disabled) { background: var(--paper-soft); border-color: var(--dim); }
.btn:active:not(:disabled) { transform: translateY(.5px); }
.btn.primary {
  background: var(--ink); border-color: var(--ink); color: var(--paper);
  box-shadow: 0 1px 3px rgba(24, 20, 14, .18);
}
.btn.primary:hover:not(:disabled) { opacity: .88; background: var(--ink); border-color: var(--ink); }
.btn.accent {
  background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: 0 1px 3px color-mix(in srgb, var(--accent) 32%, transparent);
}
.btn.accent:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.danger:hover:not(:disabled) { opacity: .88; }
.btn.quiet {
  border-color: transparent; background: transparent; color: var(--dim);
  box-shadow: none; padding: 0 8px; height: 28px; font-weight: 400;
}
.btn.quiet:hover:not(:disabled) { background: var(--hover); color: var(--ink); border-color: transparent; }
.btn.sm { height: 27px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }

.link-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; color: var(--accent); font-weight: 500;
}
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.link-btn.muted { color: var(--dim); font-weight: 400; }
.link-btn.muted:hover { color: var(--ink); text-decoration: none; }
.link-btn.danger { color: var(--dim); font-weight: 400; }
.link-btn.danger:hover { color: var(--err); text-decoration: none; }

input[type="text"], input[type="search"], select, textarea {
  background: var(--paper); border: 1px solid var(--line-warm); border-radius: 8px;
  padding: 6px 10px; outline: 0; transition: border-color .14s, box-shadow .14s;
}
input[type="text"]:focus, input[type="search"]:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
textarea { width: 100%; resize: vertical; line-height: 1.65; }

/* ── Shell & Top Bar ─────────────────────────────────────────────────────── */
.shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.topbar {
  flex: none; height: 50px; padding: 0 18px;
  display: flex; align-items: center; gap: 18px;
  background: var(--paper); border-bottom: 1px solid var(--line);
  z-index: 20;
}
.brand {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14.5px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap;
}
.brand-seal {
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
}
.brand span { font-weight: 400; color: var(--dim); }
body.embedded .brand { display: none; }

.htabs {
  display: flex; align-items: stretch; gap: 4px; height: 100%;
  overflow-x: auto; scrollbar-width: none;
}
.htabs::-webkit-scrollbar { display: none; }
.htab {
  position: relative; display: inline-flex; align-items: center; gap: 7px;
  padding: 0 11px; font-size: 13.5px; color: var(--dim); white-space: nowrap;
  transition: color .14s;
}
.htab:hover { color: var(--ink); }
.htab.on { color: var(--ink); font-weight: 600; }
.htab.on::after {
  content: ""; position: absolute; left: 9px; right: 9px; bottom: 0;
  height: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
}
.htab.off { color: var(--faint); }
.htab small {
  font-size: 11px; color: var(--faint); font-weight: 500;
  font-variant-numeric: tabular-nums;
  padding: 0 5px; border-radius: 999px; background: var(--well); line-height: 1.6;
}
.htab.on small { background: var(--accent-soft); color: var(--accent); }
.htab small.match { background: var(--accent); color: #fff; }
.htab .dot-alert { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.htab .dot-alert.err { background: var(--err); }

.top-right { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.search-box { position: relative; display: flex; align-items: center; width: 214px; margin-right: 4px; }
.search-box .s-ico { position: absolute; left: 9px; color: var(--faint); pointer-events: none; }
.search-box input {
  width: 100%; height: 30px; padding: 0 28px 0 29px; font-size: 13px;
  background: var(--well); border: 1px solid transparent; border-radius: 8px;
}
.search-box input:hover { border-color: var(--line-warm); }
.search-box input:focus { background: var(--paper); border-color: var(--accent); }
.search-box input::placeholder { color: var(--faint); }
.search-box .s-hint {
  position: absolute; right: 8px; pointer-events: none;
  font: 11px var(--mono); color: var(--faint);
  padding: 0 4px; border-radius: 4px; border: 1px solid var(--line);
}
.search-box .s-clear {
  position: absolute; right: 5px; width: 20px; height: 20px;
  display: grid; place-items: center; border-radius: 5px; color: var(--dim);
}
.search-box .s-clear:hover { background: var(--hover); color: var(--ink); }

.top-act {
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 9px; border-radius: 7px;
  font-size: 13px; color: var(--dim); white-space: nowrap;
  transition: background .12s, color .12s;
}
.top-act:hover { background: var(--hover); color: var(--ink); }
.mobile-toggle { display: none; }

/* ── Split Workspace ─────────────────────────────────────────────────────── */
.workspace {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 278px minmax(0, 1fr);
  position: relative;
}

/* ── Left Architectural Linen Rail ───────────────────────────────────────── */
.rail {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--rail); border-right: 1px solid var(--line);
  user-select: none;
}
.rail-head {
  flex: none; padding: 14px 14px 10px;
  display: flex; flex-direction: column; gap: 10px;
}
.rail-cwd {
  display: flex; align-items: center; gap: 6px;
  font: 11.5px/1.4 var(--mono); color: var(--dim);
  padding: 4px 8px; border-radius: 7px; background: color-mix(in srgb, var(--well) 70%, transparent);
  overflow: hidden;
}
.rail-cwd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rail-overview {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2);
  transition: background .12s, color .12s, box-shadow .12s;
}
.rail-overview:hover { background: var(--hover); color: var(--ink); }
.rail-overview.on {
  background: var(--paper); color: var(--ink); font-weight: 600;
  box-shadow: var(--ring-sm);
}
.rail-overview-l { display: inline-flex; align-items: center; gap: 8px; }
.rail-overview-l .icon { color: var(--accent); }
.rail-overview small { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

.rail-filters {
  display: flex; gap: 4px; padding: 3px; border-radius: 8px;
  background: color-mix(in srgb, var(--line) 55%, transparent);
}
.rfilter {
  flex: 1; text-align: center; padding: 3px 6px; border-radius: 6px;
  font-size: 12px; color: var(--dim); transition: background .12s, color .12s, box-shadow .12s;
}
.rfilter:hover { color: var(--ink); }
.rfilter.on { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: var(--ring-sm); }

.rail-body { flex: 1; overflow-y: auto; padding: 4px 10px 18px; }
.rail-label {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 10px 7px; font-size: 11px; color: var(--faint); letter-spacing: .04em;
}

.tree-layer { margin-bottom: 3px; }
.tl-row {
  display: flex; align-items: center; gap: 7px;
  width: 100%; padding: 6px 6px 6px 8px; border-radius: 8px;
  text-align: left; color: var(--ink-2);
  transition: background .12s, color .12s, box-shadow .12s;
}
.tl-row:hover { background: var(--hover); color: var(--ink); }
.tl-row.on { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: var(--ring-sm); }
.tl-swatch {
  width: 8px; height: 8px; border-radius: 3px; flex: none;
  background: var(--pigment, var(--accent));
}
.tl-swatch.ondemand {
  background: transparent; border: 1.6px solid var(--pigment, var(--accent));
}
.tl-idx {
  font: 11px/1 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; flex: none;
}
.tl-name {
  flex: 1; min-width: 0; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-tag { font-size: 10.5px; color: var(--faint); flex: none; }
.tl-dot-warn { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; }
.tl-dot-warn.err { background: var(--err); }
.tl-chev {
  width: 18px; height: 18px; display: grid; place-items: center;
  border-radius: 4px; color: var(--faint); flex: none;
  transition: transform .15s, color .12s;
}
.tl-chev:hover { color: var(--ink); }
.tree-layer.open .tl-chev { transform: rotate(90deg); }

.tl-files {
  display: none; flex-direction: column; gap: 1px;
  margin: 2px 0 6px 12px; padding-left: 13px;
  border-left: 1.5px solid color-mix(in srgb, var(--pigment, var(--line-warm)) 35%, var(--line));
}
.tree-layer.open .tl-files { display: flex; }

.tf-row {
  display: flex; align-items: center; gap: 7px;
  width: 100%; padding: 4.5px 8px; border-radius: 7px;
  text-align: left; color: var(--ink-2);
  transition: background .12s, color .12s, box-shadow .12s;
}
.tf-row:hover { background: var(--hover); color: var(--ink); }
.tf-row.on { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: var(--ring-sm); }
.tf-row.missing { color: var(--faint); }
.tf-row.shadowed { color: var(--faint); }
.tf-row.shadowed .tf-name { text-decoration: line-through; }

.status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--pigment, var(--ink-2)); }
.status-dot.ondemand { background: transparent; border: 1.5px solid var(--pigment, var(--dim)); }
.status-dot.missing { background: transparent; border: 1.3px dashed var(--faint); }
.status-dot.shadowed { background: var(--line-warm); }

.tf-name {
  flex: 1; min-width: 0; font: 12px/1.45 var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tf-cnt { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.tf-new {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 6px; font-size: 12px; color: var(--dim); text-align: left;
}
.tf-new:hover { background: var(--hover); color: var(--accent); }

.rail-foot {
  flex: none; padding: 12px 14px 14px;
  border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.rail-issue-btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 9px; border-radius: 7px;
  font-size: 12.5px; font-weight: 500; color: var(--warn); background: var(--warn-soft);
  transition: filter .12s;
}
.rail-issue-btn.err { color: var(--err); background: var(--err-soft); }
.rail-issue-btn:hover { filter: brightness(.96); }
.rail-issue-l { display: inline-flex; align-items: center; gap: 7px; }

.rail-budget {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 8px 10px; border-radius: 8px; background: var(--paper); box-shadow: var(--ring-sm);
  transition: box-shadow .14s;
}
.rail-budget:hover { box-shadow: var(--ring-sheet); }
.rb-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--dim); }
.rb-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.rb-row.over b { color: var(--err); }
.meter-bar { display: flex; gap: 2px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--well); }
.meter-bar i { display: block; height: 100%; min-width: 3px; border-radius: 2px; background: var(--pigment, var(--accent)); }

/* ── Right Canvas (Warm Archival Desk) ───────────────────────────────────── */
.canvas {
  min-width: 0; min-height: 0; overflow-y: auto;
  padding: 28px clamp(20px, 4.2vw, 54px) 92px;
  background: var(--canvas);
}
.stage {
  max-width: 860px; margin: 0 auto;
  animation: rise .18s cubic-bezier(.16, 1, .3, 1);
}

/* Breadcrumb */
.crumb {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--faint); margin-bottom: 14px;
}
.crumb button { color: var(--dim); transition: color .12s; }
.crumb button:hover { color: var(--ink); }
.crumb .cur { color: var(--ink-2); font-weight: 500; }

/* ── Overview Header & Sculptural Strata Diagram ─────────────────────────── */
.ov-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.ov-title-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ov-head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; }
.ov-status { font-size: 12px; color: var(--dim); }
.ov-lede { color: var(--dim); margin-top: 6px; max-width: 64ch; font-size: 13.8px; line-height: 1.65; }

/* The Architectural Strata Elevation Panel (Visual Centerpiece!) */
.strata-stage {
  position: relative;
  border-radius: 14px; padding: 18px 20px 18px;
  background: var(--paper);
  box-shadow: var(--ring-sheet);
  margin-bottom: 26px;
  overflow: hidden;
}
.strata-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.strata-heading {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
}
.strata-heading b { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.strata-heading span { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.strata-legend {
  display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--dim);
}
.sleg { display: inline-flex; align-items: center; gap: 5px; }
.sleg-box {
  width: 12px; height: 7px; border-radius: 2px; background: var(--ink-2); opacity: .7;
}
.sleg-box.dashed {
  background: repeating-linear-gradient(-45deg, transparent, transparent 2px, var(--dim) 2px, var(--dim) 3.5px);
  border: 1px dashed var(--dim); opacity: .65;
}

.strata-body {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: stretch;
}
.strata-axis {
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 6px 0; font-size: 10.5px; color: var(--faint); user-select: none;
}
.strata-axis-line {
  flex: 1; width: 1.5px; margin: 5px 0;
  background: linear-gradient(to bottom, var(--line-warm), var(--accent));
  position: relative;
}
.strata-axis-line::after {
  content: ""; position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--accent);
}

.strata-plates {
  display: flex; flex-direction: column; gap: 6px;
}
.plate {
  position: relative;
  display: grid; grid-template-columns: 28px 118px minmax(0, 1fr) auto;
  align-items: center; gap: 10px;
  padding: 8px 13px; border-radius: 9px; text-align: left;
  margin-left: calc(var(--step, 0) * 6px);
  background: color-mix(in srgb, var(--pigment) 9%, var(--paper));
  border: 1px solid color-mix(in srgb, var(--pigment) 24%, var(--line));
  box-shadow: var(--specular), 0 1px 2px rgba(36, 30, 22, .035);
  transition: transform .16s cubic-bezier(.16, 1, .3, 1), box-shadow .16s, border-color .16s, background .16s;
}
.plate::before {
  content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--pigment);
}
.plate.ondemand {
  background: repeating-linear-gradient(
    -45deg,
    var(--paper-soft),
    var(--paper-soft) 7px,
    color-mix(in srgb, var(--pigment) 5.5%, var(--paper-soft)) 7px,
    color-mix(in srgb, var(--pigment) 5.5%, var(--paper-soft)) 14px
  );
  border-style: dashed;
  border-color: color-mix(in srgb, var(--pigment) 34%, var(--line));
  box-shadow: none;
}
.plate:hover {
  transform: translateX(3px) translateY(-1px);
  border-color: var(--pigment);
  box-shadow: var(--ring-lift);
  z-index: 2;
}
.plate-idx {
  font: italic 600 13px/1 var(--serif-num); color: var(--pigment); text-align: center;
}
.plate-name {
  font-size: 13px; font-weight: 600; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.plate-bar-cell {
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.plate-track {
  flex: 1; height: 6px; border-radius: 4px; overflow: hidden;
  background: color-mix(in srgb, var(--pigment) 12%, transparent);
  max-width: 260px;
}
.plate-fill {
  height: 100%; border-radius: 4px; background: var(--pigment);
  transition: width .35s cubic-bezier(.16, 1, .3, 1);
}
.plate.ondemand .plate-fill { opacity: .45; }
.plate-dots {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.pdot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--pigment);
}
.pdot.off { background: transparent; border: 1.2px dashed var(--faint); }
.plate-meta {
  display: flex; align-items: center; gap: 10px; flex: none;
  font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.plate-empty-txt { color: var(--faint); font-style: normal; }

/* Editorial Callout for Issues */
.callout {
  margin-bottom: 22px; padding: 12px 16px; border-radius: 10px;
  background: var(--warn-soft);
  border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent);
  border-left: 3px solid var(--warn);
  display: flex; flex-direction: column; gap: 6px;
}
.callout.err {
  background: var(--err-soft);
  border-color: color-mix(in srgb, var(--err) 26%, transparent);
  border-left-color: var(--err);
}
.callout-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font-size: 12.5px; font-weight: 600; color: var(--warn);
}
.callout.err .callout-head { color: var(--err); }
.callout-item {
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
  text-align: left; font-size: 13px; color: var(--ink-2); padding: 2px 0;
}
button.callout-item:hover { color: var(--ink); }
button.callout-item:hover .callout-go { text-decoration: underline; text-underline-offset: 3px; }
.callout-go { font-size: 12px; color: var(--accent); white-space: nowrap; flex: none; font-weight: 500; }

/* ── Archival Folio Stack (Layered Cascade in Overview) ──────────────────── */
.folio-cascade {
  position: relative; display: flex; flex-direction: column; gap: 22px;
  padding-left: 22px;
}
.folio-cascade::before {
  content: ""; position: absolute; left: 7px; top: 18px; bottom: 18px; width: 1.5px;
  background: linear-gradient(to bottom, var(--line-warm), color-mix(in srgb, var(--accent) 55%, var(--line-warm)));
}

.folio-tier { position: relative; }
.folio-node {
  position: absolute; left: -21px; top: 10px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--canvas); border: 2.5px solid var(--pigment);
  box-shadow: 0 0 0 3px var(--canvas);
}
.folio-tier.ondemand .folio-node { border-style: dashed; border-width: 2px; }

/* Physical Archival Index Tab perched seamlessly atop the sheet */
.folio-tab-row {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding-right: 4px;
}
.folio-tab {
  position: relative; z-index: 2; margin-bottom: -1px;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px 6px 12px;
  border-radius: 10px 10px 0 0;
  background: var(--paper);
  border: 1px solid color-mix(in srgb, var(--pigment) 24%, var(--line));
  border-bottom: 0;
  cursor: pointer; transition: color .12s;
}
.folio-tab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 3px;
  background: var(--paper); pointer-events: none;
}
.folio-tier.ondemand .folio-tab {
  background: var(--paper-soft);
  border-style: dashed;
  border-bottom: 0;
}
.folio-tier.ondemand .folio-tab::after { background: var(--paper-soft); }
.folio-tab-idx {
  font: italic 600 13px/1 var(--serif-num); color: var(--pigment);
}
.folio-tab h2 { font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
.folio-tab:hover h2 { color: var(--pigment); }
.folio-tab-kind {
  font-size: 11px; color: var(--pigment); font-weight: 500;
  padding: 1px 7px; border-radius: 999px;
  background: color-mix(in srgb, var(--pigment) 11%, transparent);
}
.folio-tab-right {
  display: flex; align-items: center; gap: 12px; padding-bottom: 5px;
  font-size: 12px; color: var(--dim);
}

.folio-sheet {
  position: relative; z-index: 1;
  border-radius: 0 12px 12px 12px;
  background: var(--paper);
  border: 1px solid color-mix(in srgb, var(--pigment) 24%, var(--line));
  box-shadow: var(--ring-sheet);
  overflow: hidden;
  transition: box-shadow .16s;
}
.folio-tier.ondemand .folio-sheet {
  background: var(--paper-soft);
  border-style: dashed;
  box-shadow: none;
}
.folio-sheet-desc {
  padding: 11px 18px 10px; font-size: 12.8px; color: var(--dim); line-height: 1.58;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.folio-sheet-desc p { max-width: 64ch; }
.folio-sheet-stats { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }

.file-list { display: flex; flex-direction: column; }
.frow {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 18px; border-top: 1px solid var(--line);
  cursor: pointer; transition: background .12s;
}
.frow:first-child { border-top: 0; }
.frow:hover { background: var(--hover); }
.frow.missing .frow-path { color: var(--faint); font-weight: 400; }
.frow.shadowed .frow-path { color: var(--faint); text-decoration: line-through; }
.frow-dot { margin-top: 7px; }
.frow-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.frow-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.frow-path { font: 500 13px/1.45 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.frow-tag {
  font-size: 11px; padding: 0 6px; border-radius: 4px; line-height: 1.6;
  background: var(--well); color: var(--dim);
}
.frow-tag.warn { background: var(--warn-soft); color: var(--warn); }
.frow-tag.accent { background: var(--accent-soft); color: var(--accent); }
.frow-preview {
  font-size: 12.5px; color: var(--dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62ch;
}
.frow-right {
  display: flex; align-items: center; gap: 11px; flex: none; padding-top: 1px;
  font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.frow-go { color: var(--faint); transition: transform .14s, color .14s; }
.frow:hover .frow-go { color: var(--accent); transform: translateX(2px); }

.folio-dir-bar {
  padding: 8px 18px; border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--well) 45%, transparent);
  display: flex; gap: 14px; flex-wrap: wrap;
}
.folio-dir-btn {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12.5px; color: var(--dim); transition: color .12s;
}
.folio-dir-btn:hover { color: var(--accent); }

.cascade-foot {
  margin-top: 24px; text-align: center;
  font-size: 12px; color: var(--faint);
}

/* ── Focused Layer & Focused File Folio Sheet ────────────────────────────── */
.paper-folio {
  position: relative;
  border-radius: 14px;
  background: var(--paper);
  box-shadow: var(--ring-sheet);
  overflow: hidden;
}
.paper-ribbon {
  height: 3.5px; background: var(--pigment, var(--accent));
}
.paper-inner {
  padding: 26px clamp(20px, 3.6vw, 38px) 36px;
}

.doc-head { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.doc-head.with-tabs { padding-bottom: 0; border-bottom: 0; }
.doc-title-row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.doc-title-l { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.doc-step {
  font: italic 600 14px/1 var(--serif-num); color: var(--pigment);
  padding: 4px 9px; border-radius: 7px;
  background: color-mix(in srgb, var(--pigment) 11%, transparent);
}
.doc-head h1 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.doc-head h1.mono { font-size: 18px; letter-spacing: -.015em; overflow-wrap: anywhere; }
.doc-lede { color: var(--dim); margin-top: 8px; max-width: 64ch; font-size: 13.8px; line-height: 1.65; }
.doc-meta {
  display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap;
  margin-top: 10px; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums;
}
.doc-meta .sep { color: var(--line-warm); }
.exceptions { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }

.doc-tabs {
  display: flex; align-items: center; gap: 18px;
  margin-top: 18px; border-bottom: 1px solid var(--line);
}
.dtab {
  position: relative; padding: 8px 2px 10px;
  font-size: 13.5px; color: var(--dim); transition: color .12s;
}
.dtab:hover { color: var(--ink); }
.dtab.on { color: var(--ink); font-weight: 600; }
.dtab.on::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--pigment, var(--accent)); border-radius: 2px 2px 0 0;
}
.dtab small { font-size: 12px; color: var(--faint); margin-left: 4px; font-variant-numeric: tabular-nums; font-weight: 400; }
.doc-tab-acts { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-bottom: 2px; }

/* Metadata & @import Ledger */
.ledger {
  margin-top: 16px; padding: 10px 14px; border-radius: 9px;
  background: var(--paper-soft); border: 1px solid var(--line);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 16px;
  font-size: 12.5px; align-items: baseline;
}
.ledger dt { font: 11.5px var(--mono); color: var(--faint); }
.ledger dd { margin: 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 12px; }
.imp-link { font: 12px var(--mono); color: var(--accent); }
.imp-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.imp-link.broken { color: var(--warn); cursor: default; }
.imp-link.broken:hover { text-decoration: none; }

/* Structured Entries Document */
.entries-doc { margin-top: 22px; }
.sec-block { margin-top: 26px; }
.sec-block:first-child { margin-top: 0; }
.sec-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding-bottom: 6px; margin-bottom: 4px;
  border-bottom: 1px solid var(--line);
}
.sec-title { font-size: 12.5px; font-weight: 600; color: var(--dim); }
.sec-title .sep { color: var(--faint); margin: 0 5px; font-weight: 400; }
.sec-add { font-size: 12px; color: var(--faint); opacity: 0; transition: opacity .12s, color .12s; }
.sec-block:hover .sec-add, .sec-add:focus-visible { opacity: 1; }
.sec-add:hover { color: var(--accent); }

.entry {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 0 10px;
  align-items: baseline;
  padding: 7.5px 10px; margin: 0 -10px; border-radius: 8px;
  transition: background .1s;
}
.entry:hover, .entry:focus-within { background: var(--hover); }
.entry.flash { animation: flashRow 1.8s ease-out; }
.entry-mark {
  width: 5px; height: 5px; border-radius: 50%; margin: 0 auto;
  background: var(--pigment, var(--faint)); opacity: .6;
  transform: translateY(-2px);
}
.entry-mark.none { background: transparent; }
.entry-body { min-width: 0; }
.entry-text {
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: 14px; line-height: 1.68; color: var(--ink);
}
.entry-text code.inline {
  font: .87em var(--mono); padding: 1.5px 5px; border-radius: 5px;
  background: var(--well); color: var(--ink-2);
}
.entry-text .imp-inline {
  font: .89em var(--mono); color: var(--accent);
  text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px;
}
.entry-text .imp-inline.broken { color: var(--warn); cursor: default; }

.code-block {
  margin: 2px 0; border-radius: 8px; background: var(--well); border: 1px solid var(--line);
  overflow: hidden;
}
.code-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 10px; font: 11px var(--mono); color: var(--faint);
  border-bottom: 1px solid var(--line);
}
.code-bar button { font: 11.5px var(--sans); color: var(--dim); }
.code-bar button:hover { color: var(--ink); }
.code-block pre {
  margin: 0; padding: 10px 12px; overflow-x: auto;
  font: 12.5px/1.6 var(--mono); color: var(--ink-2);
}

.entry-right { display: flex; align-items: baseline; justify-content: flex-end; min-width: 0; }
.entry-origin {
  font-size: 12px; color: var(--faint); white-space: nowrap;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis;
}
.entry-origin.uncommitted { color: var(--warn); }
.entry-acts { display: none; gap: 12px; font-size: 12.5px; white-space: nowrap; }
.entry-acts button { color: var(--dim); font-weight: 500; }
.entry-acts button:hover { color: var(--accent); }
.entry-acts button.del:hover { color: var(--err); }
.entry:hover .entry-origin, .entry:focus-within .entry-origin { display: none; }
.entry:hover .entry-acts, .entry:focus-within .entry-acts { display: flex; }

/* Inline Editing & Composer */
.entry.editing {
  display: block; background: var(--paper-soft); border: 1px solid var(--line-warm);
  padding: 12px 14px; margin: 4px -10px;
}
.entry.editing textarea { font: 13px/1.62 var(--mono); background: var(--paper); }
.inline-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  flex-wrap: wrap; margin-top: 8px;
}
.inline-btns { display: flex; align-items: center; gap: 8px; }

.add-trigger {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 18px; padding: 6px 11px; margin-left: -11px; border-radius: 8px;
  font-size: 13.5px; color: var(--dim); transition: background .12s, color .12s;
}
.add-trigger:hover { background: var(--hover); color: var(--accent); }

.composer {
  margin-top: 16px; padding: 13px 15px; border-radius: 10px;
  background: var(--paper-soft); border: 1px solid var(--line-warm);
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  border: 0 !important; box-shadow: none !important; padding: 0; background: transparent;
  font: 14px/1.65 var(--sans); min-height: 54px;
}
.composer-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
}
.composer-where { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); flex-wrap: wrap; }
.composer-where select, .composer-where input { padding: 4px 8px; font-size: 12.5px; }

/* Full Source Editor */
.source-wrap { margin-top: 18px; display: flex; flex-direction: column; gap: 12px; }
.source-warn {
  font-size: 12.5px; color: var(--accent); padding: 8px 12px; border-radius: 8px;
  background: var(--accent-soft);
}
.source-limit {
  display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
}
.source-limit.warn { color: var(--warn); }
.source-limit.over { color: var(--err); font-weight: 500; }
.source-limit-track { width: 150px; height: 4px; border-radius: 3px; background: var(--well); overflow: hidden; }
.source-limit-track i { display: block; height: 100%; background: var(--ok); }
.source-limit.warn .source-limit-track i { background: var(--warn); }
.source-limit.over .source-limit-track i { background: var(--err); }
.source-editor {
  width: 100%; min-height: 430px; padding: 14px 16px;
  font: 13px/1.68 var(--mono); background: var(--paper-soft);
  border: 1px solid var(--line-warm); border-radius: 10px; tab-size: 2;
}
.source-editor:focus { background: var(--paper); border-color: var(--accent); }
.source-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
}
.source-bar-l { display: flex; align-items: center; gap: 12px; }
.dirty-flag { color: var(--warn); font-weight: 600; }

/* Empty State */
.empty-state {
  padding: 28px 0 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.empty-state h3 { font-size: 15.5px; font-weight: 600; }
.empty-state p { font-size: 13.5px; color: var(--dim); max-width: 54ch; }
.empty-acts { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

/* Search View */
.search-head {
  padding-bottom: 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.search-head h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
.search-others { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); }
.search-group { margin-top: 22px; }
.search-group-head {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding-bottom: 7px; margin-bottom: 4px; border-bottom: 1px solid var(--line);
}
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ── Paper Modals ────────────────────────────────────────────────────────── */
dialog {
  border: 0; border-radius: 14px;
  background: var(--paper); color: var(--ink); padding: 0;
  width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  box-shadow: var(--shadow-modal); overflow: hidden;
}
dialog.narrow { width: min(500px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(20, 18, 14, .44); backdrop-filter: blur(3px); }
dialog[open] { display: flex; flex-direction: column; animation: rise .16s cubic-bezier(.16, 1, .3, 1); }
.dh {
  flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 20px 24px 0;
}
.dh h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.dh button { font-size: 13px; color: var(--dim); }
.dh button:hover { color: var(--ink); }
.db {
  flex: 1; overflow-y: auto; padding: 14px 24px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.df {
  flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 12px 24px 18px; border-top: 1px solid var(--line); background: var(--paper-soft);
}

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.field-hint { font-size: 12.5px; color: var(--dim); line-height: 1.58; }
.field-err { font-size: 12px; color: var(--err); }
.quote {
  padding: 10px 13px; border-radius: 8px; background: var(--well); border: 1px solid var(--line);
  font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 140px; overflow-y: auto;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  padding: 2px 9px; border-radius: 6px; font-size: 12px;
  background: var(--well); color: var(--dim); border: 1px solid transparent;
  transition: color .12s, border-color .12s;
}
.chip-btn:hover { color: var(--accent); border-color: var(--accent); }

.eff-chunk {
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  background: var(--paper-soft);
}
.eff-head {
  padding: 7px 12px; border-bottom: 1px solid var(--line);
  font: 500 12px var(--mono); color: var(--accent); background: var(--well);
}
dialog pre.raw {
  margin: 0; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  font: 12.5px/1.65 var(--mono); color: var(--ink-2);
}

.hist-group h4 { font-size: 11.5px; font-weight: 600; color: var(--dim); letter-spacing: .04em; margin: 2px 0 8px; }
.hist-list { border-top: 1px solid var(--line); }
.hist-row {
  display: grid; grid-template-columns: 142px minmax(0, 1fr) auto; gap: 6px 14px;
  align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.hist-time { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hist-desc { min-width: 0; overflow-wrap: anywhere; color: var(--ink-2); }
.hist-desc code { font: 12px var(--mono); color: var(--dim); }
.hist-acts { display: flex; gap: 12px; font-size: 12.5px; white-space: nowrap; }

/* ── Toast ───────────────────────────────────────────────────────────────── */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 10px);
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--paper);
  padding: 9px 16px; border-radius: 9px; font-size: 13px;
  box-shadow: var(--shadow-modal); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 90; max-width: calc(100vw - 32px);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast.bad { background: var(--err); color: #fff; }
#toast .toast-act { font-weight: 600; text-decoration: underline; text-underline-offset: 2px; color: var(--accent-deep); }
#toast.bad .toast-act { color: #fff; }

.rail-backdrop { display: none; }

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media (max-width: 860px) {
  .plate { grid-template-columns: 26px minmax(0, 1fr) auto; margin-left: 0 !important; }
  .plate-bar-cell { display: none; }
}
@media (max-width: 780px) {
  .topbar { padding: 0 12px; gap: 10px; }
  .mobile-toggle { display: inline-flex; }
  .search-box { width: 150px; margin-right: 0; }
  .top-act .act-txt { display: none; }

  .workspace { grid-template-columns: minmax(0, 1fr); }
  .rail {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 85vw);
    z-index: 60; transform: translateX(-105%); transition: transform .2s ease;
    box-shadow: var(--shadow-modal);
  }
  body.rail-open .rail { transform: translateX(0); }
  body.rail-open .rail-backdrop {
    display: block; position: fixed; inset: 0; z-index: 55;
    background: rgba(20, 18, 14, .4);
  }
  .canvas { padding: 20px 14px 72px; }
  .folio-cascade { padding-left: 0; }
  .folio-cascade::before, .folio-node { display: none; }
  .entry { grid-template-columns: 14px minmax(0, 1fr); }
  .entry-right { grid-column: 2; justify-content: flex-start; margin-top: 3px; gap: 12px; }
  .entry-origin, .entry:hover .entry-origin { display: inline; }
  .entry-acts, .entry:hover .entry-acts { display: inline-flex; }
  .sec-add { opacity: 1; }
  .hist-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
}
@media (hover: none) {
  .sec-add { opacity: 1; }
  .entry-acts { display: flex; }
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flashRow {
  0% { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  100% { background: transparent; }
}
.spinning { animation: spin .65s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="top-act mobile-toggle" id="railToggle" aria-label="展开层级大纲" title="层级大纲"></button>
    <div class="brand">
      <span class="brand-seal" id="brandIco"></span>
      Unify<span>记忆</span>
    </div>
    <nav class="htabs" id="htabs" role="tablist" aria-label="工具切换"></nav>
    <div class="top-right">
      <div class="search-box">
        <span class="s-ico" id="searchIco"></span>
        <input id="q" type="search" placeholder="搜索记忆…" aria-label="搜索记忆">
        <span class="s-hint" id="searchHint">/</span>
        <button class="s-clear" id="searchClear" hidden aria-label="清除搜索"></button>
      </div>
      <button class="top-act" id="effectiveBtn" title="查看启动时拼接的上下文"><span class="act-txt">拼接预览</span></button>
      <button class="top-act" id="logBtn" title="查看本地修改记录与备份"><span class="act-txt">修改记录</span></button>
      <button class="top-act" id="refreshBtn" aria-label="重新扫描" title="重新扫描"></button>
    </div>
  </header>

  <div class="workspace">
    <div class="rail-backdrop" id="railBackdrop"></div>
    <aside class="rail" id="rail" aria-label="记忆层级大纲"></aside>
    <main class="canvas" id="canvas" tabindex="-1"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

if (window.self !== window.top) document.body.classList.add('embedded');

const token = location.hash.slice(1);
const $ = (id) => document.getElementById(id);

// ── Safe DOM helpers (zero innerHTML: memory content is untrusted text) ─────
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  let deferredValue;
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') deferredValue = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.style.cssText = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  if (deferredValue !== undefined) el.value = deferredValue;
  return el;
}

const ICONS = {
  layers: [['path', 'm12 3 9 4.5-9 4.5-9-4.5z'], ['path', 'm3 12 9 4.5 9-4.5'], ['path', 'm3 16.5 9 4.5 9-4.5']],
  search: [['circle', '', { cx: 11, cy: 11, r: 6.8 }], ['path', 'm19.5 19.5-3.4-3.4']],
  x: [['path', 'M18 6 6 18M6 6l12 12']],
  refresh: [['path', 'M20 11a8 8 0 1 0-2.3 5.7'], ['path', 'M20 4v7h-7']],
  chevron: [['path', 'm9 6 6 6-6 6']],
  menu: [['path', 'M4 7h16M4 12h16M4 17h16']],
  copy: [['rect', '', { x: 9, y: 9, width: 11, height: 11, rx: 2 }], ['path', 'M5 15V6a2 2 0 0 1 2-2h9']],
  eye: [['path', 'M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z'], ['circle', '', { cx: 12, cy: 12, r: 2.6 }]],
  history: [['path', 'M3 12a9 9 0 1 0 3-6.7L3 8'], ['path', 'M3 3v5h5M12 7v5l3 2']],
  plus: [['path', 'M12 5v14M5 12h14']],
  folder: [['path', 'M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z']],
};

function ico(name, size = 14) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.75');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  for (const [tag, d, attrs] of ICONS[name] || []) {
    const node = document.createElementNS(ns, tag);
    if (d) node.setAttribute('d', d);
    if (attrs) for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    svg.appendChild(node);
  }
  return svg;
}

$('brandIco').append(ico('layers', 13));
$('railToggle').append(ico('menu', 15));
$('searchIco').append(ico('search', 13));
$('searchClear').append(ico('x', 12));
$('effectiveBtn').prepend(ico('eye', 13));
$('logBtn').prepend(ico('history', 13));
$('refreshBtn').append(ico('refresh', 14));

// ── API & Formatting ────────────────────────────────────────────────────────
async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'x-unify-token': token, ...(body ? { 'content-type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status });
  return data;
}

let toastTimer;
function toast(text, opts = {}) {
  const bad = typeof opts === 'boolean' ? opts : !!opts.bad;
  const action = typeof opts === 'object' ? opts.action : null;
  const t = $('toast');
  t.replaceChildren(
    h('span', {}, text),
    action ? h('button', { class: 'toast-act', onclick: async () => { t.className = ''; await action.run(); } }, action.label) : null,
  );
  t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, bad ? 6000 : action ? 6500 : 2500);
}

const ago = (ms) => {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return '刚刚';
  if (s < 3600) return `${Math.floor(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  if (s < 86400 * 30) return `${Math.floor(s / 86400)} 天前`;
  return new Date(ms).toLocaleDateString('zh-CN');
};
const kb = (n) => (n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`);
const kilo = (n) => (n < 1000 ? String(n) : `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k`);
const pad2 = (n) => String(n).padStart(2, '0');
const normSlash = (p) => String(p || '').replace(/\\/g, '/');
function shorten(p) {
  if (!state) return p;
  const np = normSlash(p);
  const ncwd = normSlash(state.cwd).replace(/\/$/, '');
  const nhome = normSlash(state.home).replace(/\/$/, '');
  let out = np;
  if (np === ncwd) out = '.';
  else if (np.startsWith(ncwd + '/')) out = np.slice(ncwd.length + 1);
  else if (np === nhome) out = '~';
  else if (np.startsWith(nhome + '/')) out = '~' + np.slice(nhome.length);
  return out.split('/').map((part) => (part.length > 40 ? `${part.slice(0, 14)}…${part.slice(-10)}` : part)).join('/');
}
function estimateTokens(text) {
  let wide = 0;
  for (const ch of text) if (ch.codePointAt(0) > 0x2e7f) wide++;
  return Math.ceil((text.length - wide) / 4 + wide);
}
const utf8Bytes = (text) => new TextEncoder().encode(text).length;

const LOAD = { startup: '启动时载入', 'on-demand': '按需载入' };
const LOAD_SHORT = { startup: '启动', 'on-demand': '按需' };
const WRITER = { human: '人工维护', agent: '模型写入', admin: '管理员下发' };
const shown = (e) => (e.kind === 'bullet' ? e.text.replace(/^([-*+]|\d+[.)])\s+/, '').replace(/\n {2}/g, '\n') : e.text);

// ── State ───────────────────────────────────────────────────────────────────
let state = null;
let raw = '';
let current = localStorage.getItem('unify-memory-harness') || '';
let query = '';
let filter = 'all'; // 'all' | 'startup' | 'on-demand' | 'issues'
let selection = { kind: 'overview' };
let fileTab = 'entries';
let sourceDraft = null;
let openLayers = new Set();
let quickAddOpen = false;
let quickAddHeading = '';
let inlineEditing = false;
let dialogOpen = false;
let flashLine = null;
const isBusy = () => inlineEditing || dialogOpen || (sourceDraft && sourceDraft.dirty);

const harness = () => state.harnesses.find((x) => x.id === current);
const findLayer = (id, hn = harness()) => hn.layers.find((l) => l.id === id);
function findFile(path, hn = harness()) {
  for (let i = 0; i < hn.layers.length; i++) {
    const f = hn.layers[i].files.find((x) => x.path === path);
    if (f) return { layer: hn.layers[i], index: i, file: f };
  }
  return null;
}
const fileIssues = (hn, path) => hn.issues.filter((it) => it.path === path);
function layerIssues(hn, l) {
  const paths = new Set(l.files.map((f) => f.path));
  return hn.issues.filter((it) => (it.path && paths.has(it.path)) || (!it.path && it.code === 'oversize' && l.scope === 'project'));
}
const matchesEntry = (e) => !query || e.text.toLowerCase().includes(query) || e.heading.join(' ').toLowerCase().includes(query);
const countMatches = (hn) => hn.layers.reduce((a, l) => a + l.files.reduce((b, f) => b + f.entries.filter(matchesEntry).length, 0), 0);

function ensureOpenDefaults(hn) {
  for (const l of hn.layers) {
    const key = `${hn.id}:${l.id}`;
    if (!openLayers.has(key) && !openLayers.has(`!${key}`) && l.files.some((f) => f.exists)) openLayers.add(key);
  }
}

function toggleRailLayer(hn, layerId) {
  const key = `${hn.id}:${layerId}`;
  if (openLayers.has(key)) { openLayers.delete(key); openLayers.add(`!${key}`); }
  else { openLayers.delete(`!${key}`); openLayers.add(key); }
  renderRail();
}

function guardDirty(next) {
  if (sourceDraft && sourceDraft.dirty) {
    openConfirm({
      title: '放弃未保存的修改？',
      message: '当前全文编辑器中还有尚未保存的内容。离开将丢失这些改动。',
      confirmLabel: '放弃改动',
      danger: true,
      onConfirm: () => { sourceDraft = null; next(); },
    });
    return;
  }
  next();
}

function clearSearchQuiet() { if (query) { query = ''; $('q').value = ''; } }
function closeDrawer() { document.body.classList.remove('rail-open'); }

function pickHarness(id) {
  if (id === current) return;
  guardDirty(() => {
    current = id;
    localStorage.setItem('unify-memory-harness', id);
    selection = { kind: 'overview' };
    filter = 'all';
    fileTab = 'entries';
    sourceDraft = null;
    quickAddOpen = false;
    inlineEditing = false;
    ensureOpenDefaults(harness());
    render();
    $('canvas').scrollTo({ top: 0 });
  });
}

function selectOverview(nextFilter) {
  guardDirty(() => {
    clearSearchQuiet();
    selection = { kind: 'overview' };
    if (nextFilter) filter = nextFilter;
    quickAddOpen = false;
    inlineEditing = false;
    sourceDraft = null;
    closeDrawer();
    render();
    $('canvas').scrollTo({ top: 0 });
  });
}

function selectLayer(layerId) {
  guardDirty(() => {
    clearSearchQuiet();
    const hn = harness();
    openLayers.add(`${hn.id}:${layerId}`);
    openLayers.delete(`!${hn.id}:${layerId}`);
    selection = { kind: 'layer', layerId };
    if (filter === 'issues') filter = 'all';
    quickAddOpen = false;
    inlineEditing = false;
    sourceDraft = null;
    closeDrawer();
    render();
    $('canvas').scrollTo({ top: 0 });
  });
}

function selectFile(path, opts = {}) {
  guardDirty(() => {
    clearSearchQuiet();
    const hn = harness();
    const hit = findFile(path, hn);
    if (!hit) return;
    openLayers.add(`${hn.id}:${hit.layer.id}`);
    openLayers.delete(`!${hn.id}:${hit.layer.id}`);
    selection = { kind: 'file', layerId: hit.layer.id, path };
    fileTab = opts.tab || 'entries';
    if (filter === 'issues') filter = 'all';
    quickAddOpen = !!opts.quickAdd;
    quickAddHeading = opts.heading || '';
    inlineEditing = false;
    sourceDraft = null;
    flashLine = opts.line || null;
    closeDrawer();
    render();
    if (flashLine) {
      requestAnimationFrame(() => {
        const el = $('canvas').querySelector('[data-flash="1"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        flashLine = null;
      });
    } else {
      $('canvas').scrollTo({ top: 0 });
    }
  });
}

// ── Data Loading ────────────────────────────────────────────────────────────
async function load(quiet = false) {
  try {
    const next = await api('/api/state');
    const text = JSON.stringify(next);
    if (text === raw) return;
    raw = text;
    state = next;
    if (!state.harnesses.some((x) => x.id === current)) {
      current = (state.harnesses.find((x) => x.detected) || state.harnesses[0]).id;
    }
    ensureOpenDefaults(harness());
    if (selection.kind === 'file' && !findFile(selection.path)) {
      selection = findLayer(selection.layerId) ? { kind: 'layer', layerId: selection.layerId } : { kind: 'overview' };
    } else if (selection.kind === 'layer' && !findLayer(selection.layerId)) {
      selection = { kind: 'overview' };
    }
    render();
  } catch (err) {
    if (!quiet) toast(err.message, true);
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function render() {
  if (!state) return;
  renderTopbar();
  renderRail();
  renderCanvas();
}

function renderTopbar() {
  $('searchClear').hidden = !query;
  $('searchHint').hidden = !!query;

  $('htabs').replaceChildren(...state.harnesses.map((x) => {
    const files = x.layers.reduce((a, l) => a + l.files.filter((f) => f.exists).length, 0);
    const mCount = query ? countMatches(x) : null;
    const hasErr = x.issues.some((i) => i.level === 'error');
    const hasWarn = x.issues.some((i) => i.level === 'warn');
    return h('button', {
      class: `htab${x.id === current ? ' on' : ''}${x.detected ? '' : ' off'}`,
      role: 'tab',
      'aria-selected': String(x.id === current),
      onclick: () => pickHarness(x.id),
    },
      h('span', {}, x.name),
      h('small', { class: mCount ? 'match' : '' }, query ? String(mCount) : x.detected ? String(files) : '—'),
      (hasErr || hasWarn) ? h('i', { class: `dot-alert${hasErr ? ' err' : ''}`, title: `${x.issues.length} 项提醒` }) : null,
    );
  }));
}

const layerInFilter = (l) => filter === 'startup'
  ? (l.load === 'startup' || l.files.some((f) => f.exists && f.load === 'startup'))
  : filter === 'on-demand'
    ? (l.load === 'on-demand' || l.files.some((f) => f.exists && f.load === 'on-demand'))
    : true;
const fileInFilter = (f) => filter === 'startup' ? f.load === 'startup' : filter === 'on-demand' ? f.load === 'on-demand' : true;

function renderRail() {
  const hn = harness();
  const totalFiles = hn.layers.reduce((a, l) => a + l.files.filter((f) => f.exists).length, 0);
  const startup = hn.layers.flatMap((l) => l.files.filter((f) => f.exists && f.load === 'startup' && !f.shadowedBy).map((f) => ({ l, f })));
  const totalTok = Math.max(1, startup.reduce((a, x) => a + x.f.tokens, 0));
  const limit = hn.effective.limitBytes;
  const projBytes = limit ? hn.layers.filter((l) => l.scope === 'project').flatMap((l) => l.files).filter((f) => f.exists && f.load === 'startup' && !f.shadowedBy).reduce((a, f) => a + f.bytes, 0) : 0;
  const hasErr = hn.issues.some((i) => i.level === 'error');

  const head = h('div', { class: 'rail-head' },
    h('div', { class: 'rail-cwd', title: state.cwd }, ico('folder', 12), h('span', {}, shorten(state.cwd))),
    h('button', {
      class: `rail-overview${selection.kind === 'overview' && filter !== 'issues' && !query ? ' on' : ''}`,
      onclick: () => selectOverview('all'),
    },
      h('span', { class: 'rail-overview-l' }, ico('layers', 14), h('span', {}, '分层总览')),
      h('small', {}, `${totalFiles} 文件`),
    ),
    h('div', { class: 'rail-filters', role: 'group', 'aria-label': '筛选载入时机' },
      h('button', { class: `rfilter${filter === 'all' ? ' on' : ''}`, onclick: () => { filter = 'all'; render(); } }, '全部'),
      h('button', { class: `rfilter${filter === 'startup' ? ' on' : ''}`, onclick: () => { filter = 'startup'; render(); } }, '启动载入'),
      h('button', { class: `rfilter${filter === 'on-demand' ? ' on' : ''}`, onclick: () => { filter = 'on-demand'; render(); } }, '按需'),
    ),
  );

  const tree = hn.layers.map((l, idx) => ({ l, idx })).filter(({ l }) => layerInFilter(l)).map(({ l, idx }) => {
    const isOpen = openLayers.has(`${hn.id}:${l.id}`);
    const isSel = selection.kind === 'layer' && selection.layerId === l.id;
    const lIss = layerIssues(hn, l);
    const files = l.files.filter(fileInFilter);

    return h('div', { class: `tree-layer${isOpen ? ' open' : ''}`, 'data-scope': l.scope },
      h('div', {
        class: `tl-row${isSel ? ' on' : ''}`,
        role: 'button',
        tabindex: '0',
        onclick: () => selectLayer(l.id),
        onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectLayer(l.id); } },
      },
        h('i', { class: `tl-swatch${l.load === 'on-demand' ? ' ondemand' : ''}` }),
        h('span', { class: 'tl-idx' }, pad2(idx + 1)),
        h('span', { class: 'tl-name' }, l.title),
        lIss.length ? h('i', { class: `tl-dot-warn${lIss.some((i) => i.level === 'error') ? ' err' : ''}` }) : null,
        l.load === 'on-demand' ? h('span', { class: 'tl-tag' }, '按需') : l.readonly ? h('span', { class: 'tl-tag' }, '只读') : null,
        h('button', {
          class: 'tl-chev',
          'aria-label': isOpen ? `收起${l.title}` : `展开${l.title}`,
          'aria-expanded': String(isOpen),
          onclick: (ev) => { ev.stopPropagation(); toggleRailLayer(hn, l.id); },
        }, ico('chevron', 12)),
      ),
      h('div', { class: 'tl-files' },
        files.map((f) => {
          const active = selection.kind === 'file' && selection.path === f.path;
          const dotCls = !f.exists ? 'missing' : f.shadowedBy ? 'shadowed' : f.load === 'on-demand' ? 'ondemand' : '';

          return h('button', {
            class: `tf-row${active ? ' on' : ''}${!f.exists ? ' missing' : ''}${f.shadowedBy ? ' shadowed' : ''}`,

          },

            h('span', { class: 'tf-name' }, f.display),
            fIss.length ? h('i', { class: `tl-dot-warn${fIss.some((i) => i.level === 'error') ? ' err' : ''}` }) : null,
            h('span', { class: 'tf-cnt' }, f.exists ? String(query ? f.entries.filter(matchesEntry).length : f.entries.length) : (f.writable ? '+' : '')),
          );
        }),
        l.dirs.map((d) => h('button', { class: 'tf-new', onclick: () => openNewFileModal(d, l) }, `+ 新建 ${shorten(d)}/…`)),
      ),
    );
  });

  const foot = h('div', { class: 'rail-foot' },
    hn.issues.length ? h('button', {
      class: `rail-issue-btn${hasErr ? ' err' : ''}`,
      onclick: () => selectOverview('issues'),
    },
      h('span', { class: 'rail-issue-l' }, h('i', { class: `tl-dot-warn${hasErr ? ' err' : ''}` }), '诊断提醒'),
      h('span', { class: 'num' }, `${hn.issues.length} 项`),
    ) : null,
    h('button', { class: 'rail-budget', onclick: showEffective, title: '查看启动时拼接的完整记忆上下文' },
      h('div', { class: `rb-row${limit && projBytes > limit ? ' over' : ''}` },
        h('span', {}, '启动上下文'),
        h('b', {}, limit ? `${kb(projBytes)} / ${kb(limit)}` : `~${kilo(hn.effective.tokens)} tokens`),
      ),
      h('div', { class: 'meter-bar', role: 'img', 'aria-label': '各层启动上下文占比' },
        startup.map(({ l, f }) => h('i', { 'data-scope': l.scope, style: `flex:${Math.max(1, f.tokens) / totalTok}` })),
      ),
    ),
  );

  $('rail').replaceChildren(
    head,
    h('div', { class: 'rail-body' },
      h('div', { class: 'rail-label' }, h('span', {}, '记忆层级栈'), h('span', {}, '↓ 靠后优先')),
      tree,
    ),
    foot,
  );
}

// ── Canvas Views ────────────────────────────────────────────────────────────
function renderCanvas() {
  const hn = harness();
  const root = $('canvas');
  if (query) { root.replaceChildren(renderSearchView(hn)); return; }
  if (filter === 'issues' && selection.kind === 'overview') { root.replaceChildren(renderIssuesView(hn)); return; }
  if (selection.kind === 'file') {
    const hit = findFile(selection.path, hn);
    if (hit) { root.replaceChildren(renderFileSheet(hn, hit.layer, hit.index, hit.file)); return; }
  }
  if (selection.kind === 'layer') {
    const idx = hn.layers.findIndex((l) => l.id === selection.layerId);
    if (idx >= 0) { root.replaceChildren(renderLayerSheet(hn, hn.layers[idx], idx)); return; }
  }
  root.replaceChildren(renderOverview(hn));
}

// ── 1. Overview (Interactive Strata Elevation + Archival Folio Cascade) ─────
function renderOverview(hn) {
  const visibleLayers = hn.layers.map((l, idx) => ({ l, idx })).filter(({ l }) => layerInFilter(l));
  const maxLayerTokens = Math.max(1, ...hn.layers.map((l) => l.files.filter((f) => f.exists && !f.shadowedBy).reduce((a, f) => a + f.tokens, 0)));

  // Sculptural Interactive Strata Elevation Panel
  const strataPanel = h('section', { class: 'strata-stage', 'aria-label': '记忆分层剖面图' },
    h('div', { class: 'strata-top' },
      h('div', { class: 'strata-heading' },
        h('b', {}, '记忆层级剖面'),
        h('span', {}, `启动载入 ${hn.effective.files} 文件 · 约 ${kilo(hn.effective.tokens)} tokens（${kb(hn.effective.bytes)}）`),
      ),
      h('div', { class: 'strata-legend' },
        h('span', { class: 'sleg' }, h('i', { class: 'sleg-box' }), '启动载入'),
        h('span', { class: 'sleg' }, h('i', { class: 'sleg-box dashed' }), '按需载入'),
        h('button', { class: 'link-btn', style: 'font-size:12px', onclick: showEffective }, '拼接预览 →'),
      ),
    ),
    h('div', { class: 'strata-body' },
      h('div', { class: 'strata-axis', 'aria-hidden': 'true' },
        h('span', {}, '基础'),
        h('i', { class: 'strata-axis-line' }),
        h('span', {}, '优先'),
      ),
      h('div', { class: 'strata-plates' },
        hn.layers.map((l, idx) => {
          const exist = l.files.filter((f) => f.exists);
          const toks = exist.filter((f) => !f.shadowedBy).reduce((a, f) => a + f.tokens, 0);
          const pct = exist.length ? Math.max(6, Math.round((toks / maxLayerTokens) * 100)) : 0;
          const entriesCnt = exist.reduce((a, f) => a + f.entries.length, 0);
          return h('button', {
            class: `plate${l.load === 'on-demand' ? ' ondemand' : ''}`,
            'data-scope': l.scope,
            style: `--step:${Math.min(idx, 5)}`,
            title: `点击聚焦第 ${idx + 1} 层：${l.title}（${LOAD[l.load]} · ${WRITER[l.writer]}）`,
            onclick: () => selectLayer(l.id),
          },
            h('span', { class: 'plate-idx' }, pad2(idx + 1)),
            h('span', { class: 'plate-name' }, l.title),
            h('div', { class: 'plate-bar-cell' },
              h('div', { class: 'plate-track' }, h('div', { class: 'plate-fill', style: `width:${pct}%` })),
              h('div', { class: 'plate-dots' },
                l.files.slice(0, 8).map((f) => h('i', { class: `pdot${f.exists ? '' : ' off'}`, title: f.display })),
              ),
            ),
            h('div', { class: 'plate-meta' },
              exist.length
                ? [h('span', {}, `${exist.length} 文件 · ${entriesCnt} 条`), h('span', { class: 'faint' }, `~${kilo(toks)}`)]
                : h('span', { class: 'plate-empty-txt' }, l.readonly ? '未配置' : '空层'),
            ),
          );
        }),
      ),
    ),
  );

  return h('div', { class: 'stage' },
    h('header', { class: 'ov-head' },
      h('div', {},
        h('div', { class: 'ov-title-line' },
          h('h1', {}, hn.name),
          h('span', { class: 'ov-status' }, hn.detected ? `已检测到 · ${hn.layers.length} 个记忆层级` : '当前环境尚未检测到此工具'),
        ),
        h('p', { class: 'ov-lede' }, hn.summary),
      ),
    ),
    strataPanel,
    hn.issues.length ? renderCallout(hn.issues.slice(0, 4), hn.issues.length) : null,
    h('div', { class: 'folio-cascade' },
      visibleLayers.map(({ l, idx }) => renderFolioTier(hn, l, idx)),
    ),
    h('div', { class: 'cascade-foot' },
      `载入顺序 01 → ${pad2(hn.layers.length)} · 实心纸层在会话启动时自动拼接，虚线层在命中目录或规则时按需读取`,
    ),
  );
}

function renderFolioTier(hn, l, idx) {
  const files = l.files.filter(fileInFilter);
  const exist = files.filter((f) => f.exists);
  const totalTok = exist.reduce((a, f) => a + f.tokens, 0);
  const totalEntries = exist.reduce((a, f) => a + f.entries.length, 0);

  return h('section', { class: `folio-tier${l.load === 'on-demand' ? ' ondemand' : ''}`, 'data-scope': l.scope, id: `tier-${l.id}` },
    h('i', { class: 'folio-node', 'aria-hidden': 'true' }),
    h('div', { class: 'folio-tab-row' },
      h('button', { class: 'folio-tab', onclick: () => selectLayer(l.id) },
        h('span', { class: 'folio-tab-idx' }, pad2(idx + 1)),
        h('h2', {}, l.title),
        h('span', { class: 'folio-tab-kind' }, LOAD_SHORT[l.load]),
      ),
      h('div', { class: 'folio-tab-right' },
        h('span', {}, `${WRITER[l.writer]}${l.readonly ? ' · 只读' : ''}`),
        h('button', { class: 'link-btn muted', style: 'font-size:12px', onclick: () => selectLayer(l.id) }, '聚焦 →'),
      ),
    ),
    h('div', { class: 'folio-sheet' },
      h('div', { class: 'folio-sheet-desc' },
        h('p', {}, l.note),
        h('span', { class: 'folio-sheet-stats' }, exist.length ? `${exist.length} 文件 · ${totalEntries} 条 · ~${kilo(totalTok)} tok` : '暂无文件'),
      ),
      h('div', { class: 'file-list' },
        files.length ? files.map((f) => renderFileRow(hn, l, f))
          : h('div', { style: 'padding:12px 18px;font-size:13px', class: 'faint' }, '此筛选条件下没有文件'),
      ),
      l.dirs.length ? h('div', { class: 'folio-dir-bar' },
        l.dirs.map((d) => h('button', { class: 'folio-dir-btn', onclick: () => openNewFileModal(d, l) }, ico('plus', 12), `在 ${shorten(d)}/ 新建记忆文件`)),
      ) : null,
    ),
  );
}

function renderFileRow(hn, l, f) {
  const dotCls = !f.exists ? 'missing' : f.shadowedBy ? 'shadowed' : f.load === 'on-demand' ? 'ondemand' : '';
  const tags = [];
  if (!f.exists) tags.push({ text: l.readonly ? '未配置' : '未创建' });
  if (f.shadowedBy) tags.push({ text: `被 ${f.shadowedBy} 取代`, cls: 'warn' });
  if (f.importedBy) tags.push({ text: `由 ${f.importedBy} 导入`, cls: '' });
  if (f.appliesTo) tags.push({ text: `仅对 ${f.appliesTo.join(', ')}`, cls: '' });
  if (f.exists && !f.appliesTo && f.load !== l.load) tags.push({ text: LOAD[f.load], cls: '' });
  if (f.sharedWith) tags.push({ text: `与 ${f.sharedWith.join('、')} 共用`, cls: 'accent' });
  const fIss = fileIssues(hn, f.path);
  if (fIss.length) tags.push({ text: `${fIss.length} 项提醒`, cls: 'warn' });

  const firstPreview = f.meta?.description || (f.entries[0] ? shown(f.entries[0]).replace(/\s+/g, ' ').slice(0, 110) : '');

  return h('div', {
    class: `frow${!f.exists ? ' missing' : ''}${f.shadowedBy ? ' shadowed' : ''}`,
    role: 'button',
    tabindex: '0',
    onclick: () => selectFile(f.path),
    onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectFile(f.path); } },
  },
    h('i', { class: `status-dot frow-dot ${dotCls}` }),
    h('div', { class: 'frow-body' },
      h('div', { class: 'frow-top' },
        h('span', { class: 'frow-path', title: f.path }, f.display),
        tags.map((t) => h('span', { class: `frow-tag ${t.cls || ''}` }, t.text)),
      ),
      firstPreview ? h('div', { class: 'frow-preview' }, firstPreview) : null,
    ),
    h('div', { class: 'frow-right' },
      f.exists ? [
        h('span', {}, `${f.entries.length} 条`),
        h('span', {}, `~${kilo(f.tokens)}`),
        f.mtime ? h('span', {}, ago(f.mtime)) : null,
      ] : (f.writable ? h('button', {
        class: 'link-btn',
        style: 'font-size:12.5px',
        onclick: (ev) => { ev.stopPropagation(); selectFile(f.path, { quickAdd: true }); },
      }, '创建') : null),
      h('span', { class: 'frow-go', 'aria-hidden': 'true' }, '→'),
    ),
  );
}

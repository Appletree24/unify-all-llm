// ── 3. Focused File Folio Sheet ─────────────────────────────────────────────
function renderFileSheet(hn, l, idx, f) {
  const fIss = fileIssues(hn, f.path);
  const metaPairs = f.meta ? Object.entries(f.meta).filter(([, v]) => v) : [];

  const metaLine = [
    LOAD[f.load],
    WRITER[l.writer],
    !f.writable && '只读',
    !f.exists && (l.readonly ? '未配置' : '尚未创建'),
    f.exists && `${f.lines} 行`,
    f.exists && `约 ${kilo(f.tokens)} tokens（${kb(f.bytes)}）`,
    f.exists && f.mtime && `更新于 ${ago(f.mtime)}`,
    f.exists && (f.tracked ? 'Git 已追踪' : '未纳入 Git'),
  ].filter(Boolean);

  const exceptions = [
    f.shadowedBy && { text: `被 ${f.shadowedBy} 取代，不会被读取`, cls: 'warn' },
    f.importedBy && { text: `由 ${f.importedBy} 导入`, cls: '' },
    f.appliesTo && { text: `仅对 ${f.appliesTo.join(', ')} 生效`, cls: '' },
    f.sharedWith && { text: `与 ${f.sharedWith.join('、')} 共用（修改会同步影响）`, cls: 'accent' },
  ].filter(Boolean);

  const hasLedger = metaPairs.length > 0 || f.imports.length > 0;
  const ledger = hasLedger ? h('dl', { class: 'ledger' },
    metaPairs.flatMap(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]),
    f.imports.length ? [
      h('dt', {}, '@import'),
      h('dd', {}, f.imports.map((imp) => imp.exists
        ? h('button', { class: 'imp-link', onclick: () => selectFile(imp.target), title: imp.target }, shorten(imp.target))
        : h('span', { class: 'imp-link broken', title: `第 ${imp.line} 行导入不存在` }, `${shorten(imp.target)}（缺失 · L${imp.line}）`))),
    ] : null,
  ) : null;

  let content;
  if (!f.exists && fileTab !== 'source') {
    content = h('div', { class: 'empty-state' },
      h('h3', {}, l.readonly ? '尚未配置此系统策略文件' : `尚未创建 ${f.display}`),
      h('p', {}, l.note),
      f.writable ? h('div', { class: 'empty-acts' },
        h('button', { class: 'btn accent', onclick: () => { quickAddOpen = true; renderCanvas(); focusQuickAdd(); } }, '写入第一条记忆'),
        h('button', { class: 'btn', onclick: () => { fileTab = 'source'; renderCanvas(); } }, '打开全文编辑器'),
      ) : null,
      quickAddOpen && f.writable ? renderComposer(f) : null,
    );
  } else if (fileTab === 'source') {
    content = renderSourceView(hn, l, f);
  } else {
    content = renderEntriesDoc(l, f);
  }

  return h('div', { class: 'stage' },
    h('nav', { class: 'crumb', 'aria-label': '位置' },
      h('button', { onclick: () => selectOverview('all') }, hn.name),
      h('span', {}, '/'),
      h('button', { onclick: () => selectLayer(l.id) }, `${pad2(idx + 1)} ${l.title}`),
      h('span', {}, '/'),
      h('span', { class: 'cur mono' }, f.display),
    ),
    h('article', { class: 'paper-folio', 'data-scope': l.scope },
      h('div', { class: 'paper-ribbon' }),
      h('div', { class: 'paper-inner' },
        h('header', { class: 'doc-head with-tabs' },
          h('div', { class: 'doc-title-row' },
            h('div', { class: 'doc-title-l' },
              h('span', { class: 'doc-step', title: `第 ${idx + 1} 层 · ${l.title}` }, `${pad2(idx + 1)} · ${l.title}`),
              h('h1', { class: 'mono', title: f.path }, f.display),
              h('button', {
                class: 'top-act',
                style: 'height:26px;padding:0 6px',
                title: `复制绝对路径：${f.path}`,
                'aria-label': '复制路径',
                onclick: () => navigator.clipboard.writeText(f.path).then(() => toast('已复制文件路径')),
              }, ico('copy', 13)),
            ),
          ),
          h('div', { class: 'doc-meta' },
            metaLine.flatMap((part, i) => i ? [h('span', { class: 'sep' }, '·'), h('span', {}, part)] : [h('span', {}, part)]),
          ),
          exceptions.length ? h('div', { class: 'exceptions' },
            exceptions.map((ex) => h('span', { class: `frow-tag ${ex.cls}` }, ex.text)),
          ) : null,
          (f.exists || fileTab === 'source') ? h('div', { class: 'doc-tabs', role: 'tablist' },
            h('button', {
              class: `dtab${fileTab === 'entries' ? ' on' : ''}`,
              role: 'tab', 'aria-selected': String(fileTab === 'entries'),
              onclick: () => guardDirty(() => { fileTab = 'entries'; sourceDraft = null; renderCanvas(); }),
            }, f.exists ? '条目' : '概览', f.exists ? h('small', {}, String(f.entries.length)) : null),
            h('button', {
              class: `dtab${fileTab === 'source' ? ' on' : ''}`,
              role: 'tab', 'aria-selected': String(fileTab === 'source'),
              onclick: () => { fileTab = 'source'; inlineEditing = false; renderCanvas(); },
            }, f.writable ? '全文源码' : '查看全文'),
            h('div', { class: 'doc-tab-acts' },
              f.exists ? h('button', { class: 'link-btn muted', style: 'font-size:12.5px', onclick: () => openSyncModal(f) }, '同步到其他工具') : null,
              f.exists ? h('button', { class: 'link-btn muted', style: 'font-size:12.5px', onclick: () => showHistory(f) }, '来历与备份') : null,
              f.exists && f.writable ? h('button', { class: 'link-btn danger', style: 'font-size:12.5px', onclick: () => openDeleteFileModal(f) }, '删除文件') : null,
            ),
          ) : h('div', { style: 'border-bottom:1px solid var(--line);margin-top:18px' }),
        ),
        fIss.length ? h('div', { style: 'margin-top:16px' }, renderCallout(fIss, fIss.length, true)) : null,
        ledger,
        content,
      ),
    ),
  );
}

function focusQuickAdd() {
  requestAnimationFrame(() => { const el = $('quickAddTa'); if (el) el.focus(); });
}

function renderComposer(f) {
  const headings = [...new Set(f.entries.map((e) => e.heading[e.heading.length - 1]).filter(Boolean))];
  const ta = h('textarea', {
    id: 'quickAddTa',
    rows: '3',
    placeholder: '- 记下一条约定、偏好或经验…',
  });
  const sel = h('select', {
    value: quickAddHeading,
    onchange: (ev) => {
      quickAddHeading = ev.target.value;
      newHd.hidden = quickAddHeading !== '__new__';
      if (!newHd.hidden) newHd.focus();
    },
  },
    h('option', { value: '' }, '文件末尾'),
    headings.map((x) => h('option', { value: x, selected: x === quickAddHeading }, `「${x}」小节`)),
    h('option', { value: '__new__' }, '+ 新建小节…'),
  );
  const newHd = h('input', { type: 'text', placeholder: '新小节标题', hidden: quickAddHeading !== '__new__', style: 'width:150px' });

  const submit = async () => {
    if (!ta.value.trim()) return toast('请输入记忆内容', true);
    const heading = sel.value === '__new__' ? newHd.value.trim() || undefined : sel.value || undefined;
    const ok = await act({
      op: 'add', path: f.path, baseHash: f.exists ? f.hash : '', text: ta.value, heading,
    }, f.exists ? '已添加记忆' : '已创建文件并写入');
    if (ok) { quickAddOpen = false; quickAddHeading = ''; }
  };

  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); submit(); }
    if (ev.key === 'Escape') { quickAddOpen = false; renderCanvas(); }
  });

  return h('div', { class: 'composer' },
    ta,
    h('div', { class: 'composer-foot' },
      h('div', { class: 'composer-where' }, h('span', {}, '放在'), sel, newHd),
      h('div', { class: 'inline-btns' },
        h('span', { class: 'faint', style: 'font-size:12px' }, 'Ctrl+Enter 保存'),
        h('button', { class: 'btn quiet', onclick: () => { quickAddOpen = false; renderCanvas(); } }, '取消'),
        h('button', { class: 'btn sm accent', onclick: submit }, '写入'),
      ),
    ),
  );
}

function renderEntriesDoc(l, f) {
  const wrap = h('div', { class: 'entries-doc' });

  if (!f.entries.length) {
    wrap.append(h('div', { class: 'empty-state', style: 'padding-top:10px' },
      h('h3', {}, '暂无记忆条目'),
      h('p', {}, '文件已存在，但内容为空。'),
      f.writable && !quickAddOpen ? h('div', { class: 'empty-acts' },
        h('button', { class: 'btn accent', onclick: () => { quickAddOpen = true; renderCanvas(); focusQuickAdd(); } }, '添加第一条记忆'),
      ) : null,
      quickAddOpen && f.writable ? renderComposer(f) : null,
    ));
    return wrap;
  }

  const groups = [];
  for (const e of f.entries) {
    const parts = e.heading.filter(Boolean);
    const key = parts.join(' / ');
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.entries.push(e);
    else groups.push({ key, parts, lastHeading: parts[parts.length - 1] || '', entries: [e] });
  }

  for (const g of groups) {
    wrap.append(h('section', { class: 'sec-block' },
      (g.parts.length || groups.length > 1) ? h('div', { class: 'sec-head' },
        h('div', { class: 'sec-title' },
          g.parts.length ? g.parts.flatMap((p, i) => i ? [h('span', { class: 'sep' }, '/'), p] : [p]) : '未分组',
        ),
        f.writable ? h('button', {
          class: 'sec-add',
          onclick: () => { quickAddOpen = true; quickAddHeading = g.lastHeading; renderCanvas(); focusQuickAdd(); },
        }, '+ 添加到此小节') : null,
      ) : null,
      g.entries.map((e) => renderEntry(f, e, l)),
    ));
  }

  if (f.writable) {
    wrap.append(quickAddOpen
      ? renderComposer(f)
      : h('button', { class: 'add-trigger', onclick: () => { quickAddOpen = true; quickAddHeading = ''; renderCanvas(); focusQuickAdd(); } }, ico('plus', 14), '添加一条记忆…'));
  }
  return wrap;
}

function renderSourceView(hn, l, f) {
  if (!sourceDraft || sourceDraft.path !== f.path) {
    sourceDraft = { path: f.path, text: f.content || '', dirty: false };
  }
  const ta = h('textarea', {
    class: 'source-editor',
    spellcheck: 'false',
    rows: String(Math.min(28, Math.max(15, sourceDraft.text.split('\n').length + 2))),
    placeholder: '# 记忆内容\n\n- 输入一条规则或偏好',
  });
  ta.value = sourceDraft.text;
  ta.readOnly = !f.writable;

  const stats = h('div', { class: 'source-bar-l' });
  const limitEl = h('div', { class: 'source-limit', hidden: true });
  const saveBtn = h('button', { class: 'btn sm accent', onclick: saveSource }, f.exists ? '保存' : '创建文件');
  const resetBtn = h('button', { class: 'btn quiet', hidden: !sourceDraft.dirty, onclick: () => { sourceDraft = { path: f.path, text: f.content || '', dirty: false }; renderCanvas(); } }, '还原');

  const isMemoryHead = l.scope === 'auto' && /(?:^|[\\/])MEMORY\.md$/i.test(f.path);
  const projLimit = l.scope === 'project' ? hn.effective.limitBytes : null;
  const otherBytes = projLimit
    ? l.files.filter((x) => x.exists && x.path !== f.path && x.load === 'startup' && !x.shadowedBy).reduce((a, x) => a + x.bytes, 0)
    : 0;

  function update() {
    const val = ta.value;
    const lines = val ? val.split('\n').length - (val.endsWith('\n') ? 1 : 0) : 0;
    const bytes = utf8Bytes(val);
    const toks = estimateTokens(val);
    sourceDraft.text = val;
    sourceDraft.dirty = val !== (f.content || '');
    resetBtn.hidden = !sourceDraft.dirty;
    saveBtn.disabled = f.exists && !sourceDraft.dirty;

    stats.replaceChildren(
      sourceDraft.dirty ? h('span', { class: 'dirty-flag' }, '未保存') : h('span', { class: 'faint' }, f.exists ? '已同步' : '新文件'),
      h('span', {}, `${lines} 行`),
      h('span', {}, kb(bytes)),
      h('span', {}, `约 ${kilo(toks)} tokens`),
    );

    if (isMemoryHead) {
      const ratio = Math.max(lines / 200, bytes / 25000);
      limitEl.hidden = false;
      limitEl.className = `source-limit${ratio > 1 ? ' over' : ratio > .8 ? ' warn' : ''}`;
      limitEl.replaceChildren(
        h('span', {}, `启动载入上限 ${lines} / 200 行 · ${kb(bytes)} / 25 KB`),
        h('span', { class: 'source-limit-track' }, h('i', { style: `width:${Math.min(100, ratio * 100)}%` })),
      );
    } else if (projLimit) {
      const sum = otherBytes + bytes;
      const ratio = sum / projLimit;
      limitEl.hidden = false;
      limitEl.className = `source-limit${ratio > 1 ? ' over' : ratio > .8 ? ' warn' : ''}`;
      limitEl.replaceChildren(
        h('span', {}, `项目指令合计 ${kb(sum)} / ${kb(projLimit)}`),
        h('span', { class: 'source-limit-track' }, h('i', { style: `width:${Math.min(100, ratio * 100)}%` })),
      );
    }
  }

  async function saveSource() {
    if (!f.writable) return;
    try {
      await api('/api/file', { path: f.path, content: ta.value, baseHash: f.exists ? f.hash : '' });
      sourceDraft = { path: f.path, text: ta.value, dirty: false };
      toast(f.exists ? '已保存（旧版本已备份）' : '已创建文件');
      raw = '';
      await load();
    } catch (err) {
      toast(err.status === 409 ? '文件已在外部修改。请先复制你的改动，刷新后再合并保存。' : err.message, true);
    }
  }

  ta.addEventListener('input', update);
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 's' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); saveSource(); }
  });
  update();

  return h('div', { class: 'source-wrap' },
    f.sharedWith ? h('div', { class: 'source-warn' }, `此文件同时被 ${f.sharedWith.join('、')} 读取，保存后会同步影响它们。`) : null,
    limitEl,
    ta,
    h('div', { class: 'source-bar' },
      stats,
      f.writable ? h('div', { class: 'inline-btns' },
        h('span', { class: 'faint' }, 'Ctrl+S 保存 · 自动备份'),
        resetBtn,
        saveBtn,
      ) : h('span', { class: 'faint' }, '只读'),
    ),
  );
}

// ── Entry Formatting (Safe DOM) ─────────────────────────────────────────────
function highlightText(str) {
  if (!query) return [str];
  const out = [];
  const lower = str.toLowerCase();
  let at = 0, i;
  while ((i = lower.indexOf(query, at)) >= 0) {
    if (i > at) out.push(str.slice(at, i));
    out.push(h('mark', {}, str.slice(i, i + query.length)));
    at = i + query.length;
  }
  if (at < str.length) out.push(str.slice(at));
  return out;
}

function formatRichText(text, file) {
  const nodes = [];
  const parts = text.split(/(`[^`\n]+`)/g);
  for (const part of parts) {
    if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
      nodes.push(h('code', { class: 'inline' }, highlightText(part.slice(1, -1))));
      continue;
    }
    const re = /(@(?:~|\.{1,2})?\/?[\w.\-~]+(?:\/[\w.\-]+)*\.[A-Za-z0-9]+|@(?:~|\.{1,2})\/[\w.\-\/]+)/g;
    let last = 0, m;
    while ((m = re.exec(part)) !== null) {
      const idx = m.index;
      const before = idx > 0 ? part[idx - 1] : '';
      if (before && !/[\s(（]/.test(before)) continue;
      if (idx > last) nodes.push(...highlightText(part.slice(last, idx)));
      const rawImp = m[1];
      const matched = (file.imports || []).find((im) => normSlash(im.target).endsWith(normSlash(rawImp.slice(1)).replace(/^\.\//, '')));
      if (matched && matched.exists) {
        nodes.push(h('button', { class: 'imp-inline', title: `跳转到 ${matched.target}`, onclick: () => selectFile(matched.target) }, highlightText(rawImp)));
      } else if (matched && !matched.exists) {
        nodes.push(h('span', { class: 'imp-inline broken', title: '导入目标不存在' }, highlightText(rawImp)));
      } else {
        nodes.push(...highlightText(rawImp));
      }
      last = idx + rawImp.length;
    }
    if (last < part.length) nodes.push(...highlightText(part.slice(last)));
  }
  return nodes;
}

function renderCodeBlock(e) {
  const lines = e.text.split('\n');
  const lang = (lines[0] || '').trim().replace(/^(`{3,}|~{3,})/, '').trim();
  const inner = lines.length >= 2 && /^(`{3,}|~{3,})/.test(lines[lines.length - 1].trim())
    ? lines.slice(1, -1).join('\n') : e.text;
  return h('div', { class: 'code-block' },
    h('div', { class: 'code-bar' },
      h('span', {}, lang || 'code'),
      h('button', { onclick: () => navigator.clipboard.writeText(inner).then(() => toast('已复制代码')) }, '复制'),
    ),
    h('pre', {}, highlightText(inner)),
  );
}

function renderOriginSpan(f, e) {
  const o = e.origin || { kind: 'untracked' };
  const lines = `第 ${e.start}${e.end > e.start ? `–${e.end}` : ''} 行`;
  const who = o.kind === 'git' && o.commit ? `${o.commit.author} · ${ago(o.commit.time)}` : o.kind === 'uncommitted' ? '未提交' : '';
  const text = [o.via, who].filter(Boolean).join(' · ');
  const title = o.kind === 'git' && o.commit
    ? `${o.commit.summary}\n${o.commit.hash.slice(0, 7)} · ${new Date(o.commit.time).toLocaleString('zh-CN')} · ${lines}`
    : `${o.kind === 'uncommitted' ? '尚未提交的改动' : '未纳入 Git'} · ${lines}`;
  return h('span', { class: `entry-origin${o.kind === 'uncommitted' ? ' uncommitted' : ''}`, title }, text);
}

function renderEntry(f, e, l) {
  const isFlash = flashLine != null && flashLine >= e.start && flashLine <= e.end;
  const row = h('div', {
    class: `entry${isFlash ? ' flash' : ''}`,
    'data-scope': l.scope,
    'data-flash': isFlash ? '1' : null,
  },
    h('span', { class: `entry-mark${e.kind === 'bullet' ? '' : ' none'}`, 'aria-hidden': 'true' }),
    h('div', { class: 'entry-body' },
      e.kind === 'code' ? renderCodeBlock(e) : h('div', { class: 'entry-text' }, formatRichText(shown(e), f)),
    ),
    h('div', { class: 'entry-right' },
      renderOriginSpan(f, e),
      f.writable ? h('div', { class: 'entry-acts' },
        h('button', { onclick: () => startInlineEdit(row, f, e) }, '编辑'),
        h('button', { onclick: () => openTransferModal(f, e, l) }, '移动'),
        h('button', { class: 'del', onclick: () => deleteEntryWithUndo(f, e) }, '删除'),
      ) : null,
    ),
  );
  return row;
}

function startInlineEdit(row, f, e) {
  inlineEditing = true;
  const ta = h('textarea', { rows: String(Math.min(16, Math.max(3, e.text.split('\n').length + 1))) });
  ta.value = e.text;
  const cancel = () => { inlineEditing = false; renderCanvas(); };
  const save = async () => {
    inlineEditing = false;
    const ok = await act({ op: 'update', path: f.path, baseHash: f.hash, start: e.start, end: e.end, text: ta.value }, '已保存');
    if (!ok) renderCanvas();
  };
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); cancel(); }
    if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); save(); }
  });
  row.className = 'entry editing';
  row.replaceChildren(
    ta,
    h('div', { class: 'inline-foot' },
      h('span', { class: 'faint', style: 'font-size:12px' }, 'Ctrl+Enter 保存 · Esc 取消'),
      h('div', { class: 'inline-btns' },
        h('button', { class: 'btn quiet', onclick: cancel }, '取消'),
        h('button', { class: 'btn sm accent', onclick: save }, '保存'),
      ),
    ),
  );
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

async function deleteEntryWithUndo(f, e) {
  const ok = await act({ op: 'delete', path: f.path, baseHash: f.hash, start: e.start, end: e.end });
  if (!ok) return;
  toast('已删除记忆', {
    action: {
      label: '撤销',
      run: async () => {
        try {
          const { backups } = await api(`/api/backups?path=${encodeURIComponent(f.path)}`);
          if (!backups.length) return toast('未找到备份', true);
          await api('/api/restore', { id: backups[0].id });
          toast('已撤销删除');
          raw = '';
          await load();
        } catch (err) { toast(err.message, true); }
      },
    },
  });
}

// ── 4. Search & Issues Sheets ───────────────────────────────────────────────
function renderSearchView(hn) {
  const hits = [];
  for (let i = 0; i < hn.layers.length; i++) {
    const l = hn.layers[i];
    for (const f of l.files) {
      if (!f.exists) continue;
      const entries = f.entries.filter(matchesEntry);
      const pathMatch = f.display.toLowerCase().includes(query) || (f.meta?.description || '').toLowerCase().includes(query);
      if (entries.length || pathMatch) hits.push({ l, idx: i, f, entries });
    }
  }
  const total = hits.reduce((a, x) => a + x.entries.length, 0);
  const others = state.harnesses.filter((x) => x.id !== hn.id).map((x) => ({ x, cnt: countMatches(x) })).filter((o) => o.cnt > 0);

  return h('div', { class: 'stage' },
    h('div', { class: 'paper-folio' },
      h('div', { class: 'paper-inner' },
        h('div', { class: 'search-head' },
          h('div', {},
            h('h1', {}, `搜索 “${query}”`),
            h('p', { class: 'dim', style: 'margin-top:4px;font-size:13px' }, `在 ${hn.name} 找到 ${total} 条匹配记忆（${hits.length} 个文件）`),
            others.length ? h('div', { class: 'search-others' },
              h('span', {}, '其他工具：'),
              others.map(({ x, cnt }) => h('button', { class: 'link-btn', style: 'font-size:12.5px', onclick: () => pickHarness(x.id) }, `${x.name} (${cnt})`)),
            ) : null,
          ),
          h('button', { class: 'btn sm', onclick: () => { clearSearchQuiet(); render(); } }, '清除搜索'),
        ),
        hits.length ? hits.map(({ l, idx, f, entries }) => h('section', { class: 'search-group', 'data-scope': l.scope },
          h('div', { class: 'search-group-head' },
            h('span', { class: 'doc-step', style: 'font-size:12px;padding:2px 7px' }, `${pad2(idx + 1)} · ${l.title}`),
            h('button', { class: 'frow-path', onclick: () => selectFile(f.path) }, highlightText(f.display)),
            h('button', { class: 'link-btn muted', style: 'margin-left:auto;font-size:12px', onclick: () => selectFile(f.path) }, '打开 →'),
          ),
          entries.length ? entries.map((e) => renderEntry(f, e, l)) : h('p', { class: 'faint', style: 'font-size:13px;padding:8px 0' }, '路径或描述匹配'),
        )) : h('div', { class: 'empty-state' },
          h('h3', {}, `在 ${hn.name} 中没有找到匹配项`),
          h('p', {}, others.length ? '可以切换到上方有匹配结果的其他工具，或调整搜索词。' : '尝试缩短关键词。'),
        ),
      ),
    ),
  );
}

function renderCallout(issues, total, compact = false) {
  const hasErr = issues.some((i) => i.level === 'error');
  return h('section', { class: `callout${hasErr ? ' err' : ''}` },
    h('div', { class: 'callout-head' },
      h('span', {}, compact ? `此文件有 ${total} 项提醒` : `检测到 ${total} 项提醒`),
      !compact && total > issues.length ? h('button', { class: 'link-btn', style: 'font-size:12px', onclick: () => selectOverview('issues') }, `查看全部 ${total} 项`) : null,
    ),
    issues.map((it) => {
      const canJump = !!it.path && (!compact || !!it.line);
      return h(canJump ? 'button' : 'div', {
        class: 'callout-item',
        onclick: canJump ? () => selectFile(it.path, { line: it.line }) : null,
      },
        h('span', {}, it.message),
        canJump ? h('span', { class: 'callout-go' }, compact ? `第 ${it.line} 行 →` : '定位 →') : null,
      );
    }),
  );
}

function renderIssuesView(hn) {
  return h('div', { class: 'stage' },
    h('nav', { class: 'crumb' },
      h('button', { onclick: () => selectOverview('all') }, hn.name),
      h('span', {}, '/'),
      h('span', { class: 'cur' }, '诊断提醒'),
    ),
    h('div', { class: 'paper-folio' },
      h('div', { class: 'paper-inner' },
        h('header', { class: 'doc-head' },
          h('h1', {}, '诊断提醒'),
          h('p', { class: 'doc-lede' }, `${hn.name} 当前共有 ${hn.issues.length} 项结构检查结果。`),
        ),
        hn.issues.length ? h('div', { style: 'margin-top:20px' }, renderCallout(hn.issues, hn.issues.length)) : h('div', { class: 'empty-state' },
          h('h3', {}, '没有发现问题'),
          h('p', {}, '导入路径、长度上限和记忆条目均正常。'),
        ),
      ),
    ),
  );
}

// ── Actions & Paper Modals ──────────────────────────────────────────────────
async function act(body, done) {
  try {
    await api('/api/entry', body);
    if (done) toast(done);
    raw = '';
    await load();
    return true;
  } catch (err) {
    toast(err.message, true);
    if (err.status === 409) { raw = ''; await load(); }
    return false;
  }
}

function openDialog(title, bodyKids, footKids, opts = {}) {
  const d = $('dlg');
  d.className = opts.narrow ? 'narrow' : '';
  dialogOpen = true;
  d.replaceChildren(
    h('div', { class: 'dh' }, h('h3', {}, title), h('button', { onclick: () => d.close() }, '关闭')),
    h('div', { class: 'db' }, bodyKids),
    footKids ? h('div', { class: 'df' }, footKids) : null,
  );
  d.onclose = () => { dialogOpen = false; };
  d.onclick = (ev) => { if (ev.target === d) d.close(); };
  if (!d.open) d.showModal();
  return d;
}

function openConfirm({ title, message, detail, confirmLabel = '确定', danger = false, onConfirm }) {
  openDialog(title, [
    h('p', { class: 'field-hint', style: 'color:var(--ink-2);font-size:13.5px' }, message),
    detail ? h('div', { class: 'quote mono', style: 'font-size:12px' }, detail) : null,
  ], [
    h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '取消'),
    h('button', { class: `btn sm ${danger ? 'danger' : 'accent'}`, onclick: async () => { $('dlg').close(); await onConfirm(); } }, confirmLabel),
  ], { narrow: true });
}

function openDeleteFileModal(f) {
  const shared = f.sharedWith ? `此文件同时被 ${f.sharedWith.join('、')} 读取。` : '';
  openConfirm({
    title: `删除 ${f.display}`,
    message: `删除前内容会自动备份，可在「修改记录」中随时恢复。${shared}`,
    detail: f.path,
    confirmLabel: '确认删除',
    danger: true,
    onConfirm: async () => {
      try {
        await api('/api/delete', { path: f.path, baseHash: f.hash });
        const deletedPath = f.path;
        raw = '';
        await load();
        toast(`已删除 ${f.display}`, {
          action: {
            label: '撤销',
            run: async () => {
              try {
                const { backups } = await api(`/api/backups?path=${encodeURIComponent(deletedPath)}`);
                if (!backups.length) return toast('未找到备份', true);
                await api('/api/restore', { id: backups[0].id });
                toast('已恢复文件');
                raw = '';
                await load();
              } catch (err) { toast(err.message, true); }
            },
          },
        });
      } catch (err) { toast(err.message, true); }
    },
  });
}

function openNewFileModal(dir, l) {
  const nameIn = h('input', { type: 'text', value: 'notes.md', placeholder: '例如 testing.md 或 api/rules.md' });
  const contentTa = h('textarea', {
    rows: '6', style: 'font:12.5px/1.6 var(--mono)',
    placeholder: /rules/i.test(dir) ? '---\npaths:\n  - "src/**/*.ts"\n---\n\n- 规则内容' : '- 第一条记忆',
  });
  const errEl = h('div', { class: 'field-err', hidden: true });

  const create = async () => {
    const name = nameIn.value.trim();
    if (!/^[\w.\-/]+\.md$/i.test(name) || name.includes('..') || name.startsWith('/')) {
      errEl.textContent = '文件名只能包含字母、数字、. _ - /，不能包含 ..，且必须以 .md 结尾';
      errEl.hidden = false;
      nameIn.focus();
      return;
    }
    const sep = dir.includes('\\') ? '\\' : '/';
    const targetPath = `${dir.replace(/[\\/]+$/, '')}${sep}${name.replace(/\//g, sep)}`;
    try {
      await api('/api/file', { path: targetPath, content: contentTa.value, baseHash: '' });
      $('dlg').close();
      toast(`已创建 ${name}`);
      raw = '';
      await load();
      selectFile(targetPath);
    } catch (err) { errEl.textContent = err.message; errEl.hidden = false; }
  };

  nameIn.addEventListener('input', () => { errEl.hidden = true; });
  nameIn.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); create(); } });

  openDialog(`在「${l.title}」新建文件`, [
    h('div', { class: 'field' }, h('label', {}, `目录 ${shorten(dir)}/`), nameIn, errEl),
    h('div', { class: 'field' }, h('label', {}, '初始内容（可选）'), contentTa),
  ], [
    h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '取消'),
    h('button', { class: 'btn sm accent', onclick: create }, '创建'),
  ], { narrow: true });

  nameIn.focus();
  nameIn.setSelectionRange(0, nameIn.value.lastIndexOf('.'));
}

function openTransferModal(f, e, fromLayer) {
  const lookup = new Map();
  const sel = h('select', { style: 'width:100%' });
  const curIdx = harness().layers.findIndex((x) => x.id === fromLayer.id);

  for (const hn of state.harnesses) {
    const group = h('optgroup', { label: hn.name });
    hn.layers.forEach((tl, ti) => {
      for (const t of tl.files) {
        if (!t.writable || t.path === f.path || t.shadowedBy) continue;
        lookup.set(t.path, t);
        const dir = hn.id === current ? (ti < curIdx ? ' ↑上移' : ti > curIdx ? ' ↓下移' : '') : ' ⇄跨工具';
        group.append(h('option', { value: t.path }, `${pad2(ti + 1)} ${tl.title} · ${t.display}${t.exists ? '' : '（新建）'}${dir}`));
      }
    });
    if (group.children.length) sel.append(group);
  }

  const hdInput = h('input', { type: 'text', placeholder: '小节标题（留空则放在文件末尾）', value: e.heading[e.heading.length - 1] || '' });
  const chips = h('div', { class: 'chips' });

  function refreshChips() {
    const tf = lookup.get(sel.value);
    const list = tf ? [...new Set(tf.entries.map((x) => x.heading[x.heading.length - 1]).filter(Boolean))] : [];
    chips.replaceChildren(
      list.length ? h('span', { class: 'faint', style: 'font-size:12px;align-self:center' }, '已有小节：') : null,
      ...list.slice(0, 8).map((hd) => h('button', { class: 'chip-btn', type: 'button', onclick: () => { hdInput.value = hd; } }, hd)),
    );
  }
  sel.addEventListener('change', refreshChips);
  refreshChips();

  const go = async (op) => {
    if (!sel.value) return toast('没有可用的目标文件', true);
    const ok = await act({
      op, path: f.path, baseHash: f.hash, start: e.start, end: e.end,
      to: sel.value, heading: hdInput.value.trim() || undefined,
    }, op === 'move' ? '已移动' : '已复制');
    if (ok) $('dlg').close();
  };

  openDialog('复制或移动记忆', [
    h('div', { class: 'quote' }, shown(e)),
    h('div', { class: 'field' }, h('label', {}, '目标文件'), sel),
    h('div', { class: 'field' }, h('label', {}, '归属小节（可选）'), hdInput, chips),
    h('p', { class: 'field-hint' }, '可将项目中的个人习惯上移到用户层，或把约定同步给其他工具。'),
  ], [
    h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '取消'),
    h('button', { class: 'btn sm', onclick: () => go('copy') }, '复制'),
    h('button', { class: 'btn sm accent', onclick: () => go('move') }, '移动'),
  ], { narrow: true });
}

const SYNC_STATUS = {
  shared: '共用（零写入）',
  unchanged: '已是最新',
  create: '将新建',
  update: '将更新区块',
  conflict: '区块冲突',
  blocked: '已跳过',
};

function openSyncModal(f) {
  const candidates = [];
  const seen = new Set();
  for (const hn of state.harnesses) {
    for (const tl of hn.layers) {
      for (const t of tl.files) {
        if (!t.writable || t.path === f.path || seen.has(t.path)) continue;
        seen.add(t.path);
        candidates.push({ hn, tl, t });
      }
    }
  }
  const picked = new Set(candidates.filter((c) => c.tl.scope === 'project' && c.hn.id !== current && !c.t.shadowedBy).map((c) => c.t.path));
  const previewWrap = h('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  let latestPreview = null;
  const applyBtn = h('button', { class: 'btn sm accent', disabled: true, onclick: () => applySync() }, '应用同步');

  async function refreshPreview() {
    const targetPaths = [...picked];
    if (!targetPaths.length) {
      latestPreview = null;
      applyBtn.disabled = true;
      previewWrap.replaceChildren(h('p', { class: 'field-hint' }, '请先勾选至少一个目标记忆文件。'));
      return;
    }
    previewWrap.replaceChildren(h('p', { class: 'field-hint' }, '正在计算托管区块差异…'));
    try {
      const res = await api('/api/sync/preview', { sourcePath: f.path, targetPaths });
      latestPreview = res;
      const actionable = res.targets.filter((x) => x.status === 'create' || x.status === 'update');
      applyBtn.disabled = !actionable.length;
      previewWrap.replaceChildren(...res.targets.map((item) => h('div', { class: 'eff-chunk' },
        h('div', { class: 'eff-head', style: 'display:flex;justify-content:space-between;gap:10px' },
          h('span', {}, item.display),
          h('span', { style: item.status === 'conflict' || item.status === 'blocked' ? 'color:var(--warn)' : '' },
            `${SYNC_STATUS[item.status] || item.status}${item.changedLines ? ` · ${item.changedLines} 行变动` : ''}`),
        ),
        item.reason ? h('p', { class: 'field-hint', style: 'padding:8px 12px' }, item.reason) : null,
        (item.status === 'create' || item.status === 'update')
          ? h('pre', { class: 'raw', style: 'max-height:180px;overflow:auto' }, item.after || '')
          : null,
      )));
    } catch (err) {
      latestPreview = null;
      applyBtn.disabled = true;
      previewWrap.replaceChildren(h('div', { class: 'field-err' }, err.message));
    }
  }

  async function applySync() {
    if (!latestPreview) return;
    const baseHashes = Object.fromEntries(latestPreview.targets.filter((x) => x.baseHash !== undefined).map((x) => [x.targetPath, x.baseHash]));
    try {
      const res = await api('/api/sync/apply', { sourcePath: f.path, targetPaths: [...picked], baseHashes });
      const written = res.results.filter((r) => r.status === 'written').length;
      const errs = res.results.filter((r) => r.status === 'error');
      $('dlg').close();
      raw = '';
      await load();
      toast(errs.length ? `同步完成（写入 ${written} 个，失败 ${errs.length} 个）` : `已单向同步到 ${written} 个文件（旧版本已备份）`, errs.length > 0);
    } catch (err) { toast(err.message, true); }
  }

  const list = h('div', { style: 'display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto;padding:8px 10px;border-radius:8px;background:var(--well);border:1px solid var(--line)' },
    candidates.length ? candidates.map(({ hn, tl, t }) => {
      const cb = h('input', {
        type: 'checkbox',
        checked: picked.has(t.path),
        onchange: () => { if (cb.checked) picked.add(t.path); else picked.delete(t.path); void refreshPreview(); },
      });
      return h('label', { style: 'display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer' },
        cb,
        h('span', { class: 'mono' }, `${hn.name} · ${tl.title} · ${t.display}`),
        t.shadowedBy ? h('span', { class: 'faint' }, `（被 ${t.shadowedBy} 取代）`) : !t.exists ? h('span', { class: 'faint' }, '（将新建）') : null,
      );
    }) : h('p', { class: 'field-hint' }, '没有其他可同步的目标文件。'),
  );

  openDialog(`单向同步 ${f.display}`, [
    h('p', { class: 'field-hint' }, '只更新目标文件中的 <!-- unify:managed:start/end --> 托管区块，区块外手写内容逐字节保留；连续同步第二次零 diff。'),
    h('div', { class: 'field' }, h('label', {}, '选择同步目标'), list),
    previewWrap,
  ], [
    h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '取消'),
    applyBtn,
  ]);
  void refreshPreview();
}

async function showEffective() {
  try {
    const hn = harness();
    const { text } = await api(`/api/effective?harness=${encodeURIComponent(current)}`);
    const chunks = [];
    if (text) {
      let head = null, buf = [];
      const flush = () => { if (head !== null || buf.length) { chunks.push({ head, body: buf.join('\n').trim() }); buf = []; } };
      for (const line of text.split('\n')) {
        const m = /^<!--\s*(.*?)\s*-->$/.exec(line.trim());
        if (m) { flush(); head = m[1]; } else buf.push(line);
      }
      flush();
    }
    openDialog(`${hn.name} · 启动上下文拼接结果`, [
      h('p', { class: 'field-hint' }, `共 ${hn.effective.files} 个启动文件，约 ${kilo(hn.effective.tokens)} tokens（${kb(hn.effective.bytes)}）。按载入顺序拼接，不含系统提示与按需载入内容。`),
      chunks.length ? chunks.map((c, i) => h('div', { class: 'eff-chunk' },
        c.head ? h('div', { class: 'eff-head' }, `${pad2(i + 1)}  ${c.head}`) : null,
        h('pre', { class: 'raw' }, c.body || '（空）'),
      )) : h('p', { class: 'faint' }, '（空）'),
    ], [
      h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '关闭'),
      text ? h('button', { class: 'btn sm accent', onclick: () => navigator.clipboard.writeText(text).then(() => toast('已复制')) }, '复制全部') : null,
    ]);
  } catch (err) { toast(err.message, true); }
}

async function showHistory(f) {
  let backups = [];
  try { backups = (await api(`/api/backups?path=${encodeURIComponent(f.path)}`)).backups; } catch {}
  const commits = f.history || [];

  openDialog(`${f.display} 的来历`, [
    h('div', { class: 'hist-group' },
      h('h4', {}, 'Git 提交'),
      commits.length ? h('div', { class: 'hist-list' },
        commits.map((c) => h('div', { class: 'hist-row' },
          h('span', { class: 'hist-time' }, new Date(c.time).toLocaleString('zh-CN')),
          h('span', { class: 'hist-desc' }, `${c.summary} — ${c.author}`),
          h('span', { class: 'mono faint', style: 'font-size:12px' }, c.hash.slice(0, 7)),
        )),
      ) : h('p', { class: 'field-hint' }, f.tracked ? '还没有提交记录。' : '未纳入 Git，无法追溯作者。'),
    ),
    h('div', { class: 'hist-group' },
      h('h4', {}, '在此处做过的修改'),
      backups.length ? h('div', { class: 'hist-list' },
        backups.map((b) => h('div', { class: 'hist-row' },
          h('span', { class: 'hist-time' }, new Date(b.time).toLocaleString('zh-CN')),
          h('span', { class: 'hist-desc' }, `${b.reason}之前的版本 · ${kb(b.bytes)}`),
          h('span', { class: 'hist-acts' },
            h('button', { class: 'link-btn', style: 'font-size:12.5px', onclick: () => viewBackup(b, () => showHistory(f)) }, '查看'),
            h('button', { class: 'link-btn', style: 'font-size:12.5px', onclick: () => restore(b) }, '恢复'),
          ),
        )),
      ) : h('p', { class: 'field-hint' }, '还没有修改备份。'),
    ),
  ], [h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '关闭')]);
}

async function viewBackup(b, onBack) {
  try {
    const { content } = await api(`/api/backup?id=${encodeURIComponent(b.id)}`);
    openDialog(`${new Date(b.time).toLocaleString('zh-CN')} 的版本`, [
      h('p', { class: 'field-hint' }, `${b.reason}之前 · ${shorten(b.path)} · ${kb(b.bytes)}`),
      h('pre', { class: 'raw', style: 'border-radius:9px;background:var(--well);border:1px solid var(--line)' }, content || '（空）'),
    ], [
      onBack ? h('button', { class: 'btn quiet', style: 'margin-right:auto', onclick: onBack }, '← 返回') : null,
      h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '关闭'),
      h('button', { class: 'btn sm accent', onclick: () => restore(b) }, '恢复这个版本'),
    ]);
  } catch (err) { toast(err.message, true); }
}

async function restore(b) {
  try {
    await api('/api/restore', { id: b.id });
    if ($('dlg').open) $('dlg').close();
    sourceDraft = null;
    toast('已恢复');
    raw = '';
    await load();
  } catch (err) { toast(err.message, true); }
}

async function showLog() {
  try {
    const { backups } = await api('/api/backups');
    openDialog('修改记录', [
      h('p', { class: 'field-hint' }, '每次修改都会先自动备份原版本，最多保留 200 个。'),
      backups.length ? h('div', { class: 'hist-list' },
        backups.slice(0, 60).map((b) => h('div', { class: 'hist-row' },
          h('span', { class: 'hist-time' }, new Date(b.time).toLocaleString('zh-CN')),
          h('span', { class: 'hist-desc' }, `${b.reason} · `, h('code', {}, shorten(b.path))),
          h('span', { class: 'hist-acts' },
            h('button', { class: 'link-btn', style: 'font-size:12.5px', onclick: () => viewBackup(b, showLog) }, '查看'),
            h('button', { class: 'link-btn', style: 'font-size:12.5px', onclick: () => restore(b) }, '恢复'),
          ),
        )),
      ) : h('p', { class: 'faint' }, '还没有修改记录。'),
    ], [h('button', { class: 'btn sm', onclick: () => $('dlg').close() }, '关闭')]);
  } catch (err) { toast(err.message, true); }
}

// ── Events & Shortcuts ──────────────────────────────────────────────────────
$('q').addEventListener('input', (ev) => { query = ev.target.value.trim().toLowerCase(); if (state) render(); });
$('searchClear').addEventListener('click', () => { clearSearchQuiet(); render(); $('q').focus(); });
$('effectiveBtn').addEventListener('click', showEffective);
$('logBtn').addEventListener('click', showLog);
$('refreshBtn').addEventListener('click', async () => {
  const svg = $('refreshBtn').firstChild;
  if (svg) svg.classList.add('spinning');
  raw = '';
  await load();
  toast('已重新扫描');
  setTimeout(() => { if (svg) svg.classList.remove('spinning'); }, 350);
});
$('railToggle').addEventListener('click', () => document.body.classList.toggle('rail-open'));
$('railBackdrop').addEventListener('click', closeDrawer);

window.addEventListener('keydown', (ev) => {
  const tag = (ev.target && ev.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') {
    ev.preventDefault(); $('q').focus(); $('q').select();
  } else if (ev.key === '/' && !typing && !dialogOpen) {
    ev.preventDefault(); $('q').focus();
  } else if (ev.key === 'Escape' && !dialogOpen && !inlineEditing && query && document.activeElement === $('q')) {
    clearSearchQuiet(); render(); $('q').blur();
  }
});

setInterval(() => { if (!isBusy() && !document.hidden) load(true); }, 4000);

if (!token) {
  $('rail').replaceChildren();
  $('canvas').replaceChildren(
    h('div', { class: 'stage' },
      h('div', { class: 'paper-folio' },
        h('div', { class: 'paper-inner' },
          h('div', { class: 'empty-state' },
            h('h3', {}, '缺少访问令牌'),
            h('p', {}, '请打开 unify memory 打印的完整链接。'),
          ),
        ),
      ),
    ),
  );
} else {
  load();
}
</script>
